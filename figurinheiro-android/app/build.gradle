plugins { id 'com.android.application' }

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.jovone.figurinheiro'
    compileSdk 34
    defaultConfig {
        applicationId 'com.jovone.figurinheiro'
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName "1.${runNumber}"
    }
    signingConfigs {
        fixo {
            storeFile file('figurinheiro.jks')
            storePassword 'figurinheiro'
            keyAlias 'figurinheiro'
            keyPassword 'figurinheiro'
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.fixo; minifyEnabled false }
        debug { signingConfig signingConfigs.fixo }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources { noCompress 'webp' }
}

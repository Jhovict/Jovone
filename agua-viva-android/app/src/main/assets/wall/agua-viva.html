<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>jellyfish.ascii</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{position:absolute;left:0;top:0;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
const WALLPAPER = true;
/* ============================================================
   ÁGUA-VIVA ASCII — recriação em canvas
   linha do tempo (24,2 s, em loop):
   0,0  letras espalhadas convergem e montam o sino
   2,2  batida 2: clarão branco no sino
   3,0  14 tentáculos caem; braços orais descem
   6,2+ cada batida troca a paleta (onda de cor da coroa às pontas)
  10,2+ anéis de cintilações (* +) saem da borda a cada batida
  16,2 / 18,2  final: duas explosões de faíscas com rastro
  19,6  tudo escurece; reinicia
   ============================================================ */

const LOOP = 24.2, FPS = 30;
const TAU = Math.PI * 2;
const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Roboto Mono", monospace';

/* ---------- constantes do bicho ---------- */
const PETALS = 8, LAPPETS = 16, CURL = 1.75, BELL_R = 0.92, BELL_H = 1.2;
const FLARE = 0.12, RIM_LAG = 0.20, SPIN = 0.35, PITCH = -0.13;
const N_TENT = 14, TENT_LEN = 2.7, TENT_LAG = 0.25, TENT_T0 = 3.0, TENT_DROP = 1.6;
const N_ARMS = 4, ARM_LEN = 1.95, ARM_T0 = 3.3, ARM_DROP = 1.8;
const BEAT0 = 0.2, PERIOD = 2.0, LAST_BEAT = 18.2;
const COLOUR_FROM = 6.2;
const GLINT_FROM = 10.2, N_GLINTS = 28, GLINT_LIFE = 1.6;
const T_FINALE = [16.2, 18.2], BURST_SPARKS = 90, BURST_SPEED = 4.2;
const DRAG = 1.7, TAILS = 5, TAIL_GAP = 0.035;
const OUTRO = 19.6;

/* paletas: [sino A, sino B (pétalas), braços, tentáculos] */
const PALETTES = [
  ['#2445d8', '#eef3ff', '#7d6cff', '#9fb2ff'],
  ['#2fc9dc', '#9a5cff', '#ff4f9e', '#6fd3e0'],
  ['#ff3fb4', '#5468ff', '#36dcff', '#e07ad0'],
  ['#3ee070', '#f2e640', '#ff9a22', '#44c9a4'],
  ['#ff4a1c', '#ffc22e', '#a674ff', '#e8a248'],
  ['#4a5cff', '#3fe2ff', '#ffd52e', '#8c74e8'],
  ['#ff2424', '#ffd400', '#efe6e6', '#c86a78'],
  ['#2fd2ff', '#c4d2e2', '#ff3f86', '#c27fb4'],
].map(p => p.map(hex));
const SPARK_INK = ['#ffffff', '#ffe066', '#ff5a5a', '#5ad8ff', '#b78cff', '#7dff9a', '#ff8de0'].map(hex);

function hex(h){ const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

/* ---------- utilitários ---------- */
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const sstep = (a, b, x) => smooth((x - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
function hash(i){ i = Math.imul(i ^ 61 ^ (i >>> 16), 9); i ^= i >>> 4; i = Math.imul(i, 0x27d4eb2d); i ^= i >>> 15; return (i >>> 0) / 4294967296; }
function rng(seed){ let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return (s >>> 0) / 4294967296; }; }

/* rampas de letras, da mais rala à mais densa */
const RAMP = [
  ".`'", ":;,", "il!1|", "rtcz=+<>", "unxvjf{}[]", "aeosQ%", "$8B0&#", "@#$8B%",
].map(s => s.split(''));
function letter(b, id){ const g = RAMP[clamp(b * RAMP.length | 0, 0, RAMP.length - 1)]; return g[(hash(id) * g.length) | 0]; }

function slopeChar(dx, dy, flat){        // dy cresce para baixo (tela)
  let a = Math.abs(Math.atan2(dy, dx)); if (a > Math.PI / 2) a = Math.PI - a;
  if (a > 1.18) return '|';
  if (a < 0.40) return flat || '_';
  return (dx * dy < 0) ? '/' : '\\';
}

/* ---------- tempo musical ---------- */
function beatIndex(t){ return t < BEAT0 ? -1 : Math.min(Math.floor((t - BEAT0) / PERIOD), Math.round((LAST_BEAT - BEAT0) / PERIOD)); }
function squeeze(t){
  if (t < BEAT0) return 0;
  const k = beatIndex(t), x = t - (BEAT0 + k * PERIOD);
  const c = x < 0.3 ? Math.sin(x / 0.3 * Math.PI / 2) : Math.exp(-(x - 0.3) * 2.0);
  return c * sstep(1.0, 2.4, t);
}
function dropped(t, t0, dur){ const g = clamp((t - t0) / dur, 0, 1); return 1 - (1 - g) * (1 - g); }
function paletteAt(t, d){                 // d = distância ao longo do corpo (0 coroa … ~2,6 pontas)
  let n = 0;
  for (let k = 0; ; k++){
    const tb = COLOUR_FROM + k * PERIOD; if (tb > LAST_BEAT + 1e-6) break;
    if (t >= tb + d * 0.32) n = k + 1;
  }
  return n;
}
function coloursCount(t){ return paletteAt(t, 0); }

/* ---------- pose do corpo (carry) ---------- */
function pose(tt){
  const roll = 0.32 * Math.sin(TAU * (tt - 1) / 13);
  const c = squeeze(tt);
  return { cr: Math.cos(roll), sr: Math.sin(roll), bob: 0.10 * c + 0.05 * Math.sin(0.6 * tt) - 0.05, bx: 0.06 * Math.sin(0.31 * tt) };
}
const CP = Math.cos(PITCH), SP = Math.sin(PITCH);
function carry(x, y, z, P, o){
  const y1 = y * CP - z * SP, z1 = y * SP + z * CP;
  o[0] = x * P.cr - y1 * P.sr + P.bx;
  o[1] = x * P.sr + y1 * P.cr + P.bob;
  o[2] = z1;
  return o;
}
function carryN(x, y, z, P, o){            // só rotação (normais)
  const y1 = y * CP - z * SP, z1 = y * SP + z * CP;
  o[0] = x * P.cr - y1 * P.sr; o[1] = x * P.sr + y1 * P.cr; o[2] = z1; return o;
}

/* ---------- forma do sino ---------- */
function bellProfile(u, th, c, out){
  const a = u * CURL;
  const wide = BELL_R * Math.pow(Math.sin(a), 0.9) * (1 + 0.05 * Math.pow(u, 6) * Math.cos(LAPPETS * th));
  const tall = BELL_H * (Math.cos(a) - Math.cos(CURL)) / (1 - Math.cos(CURL));
  const r = wide * (1 + FLARE * Math.pow(u, 8) - 0.30 * Math.pow(u, 1.6) * c);
  out[0] = r; out[1] = tall * (1 + 0.15 * c);
  return out;
}

/* ============================================================
   canvas / layout
   ============================================================ */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const scn = document.createElement('canvas'), sctx = scn.getContext('2d');
const glw = document.createElement('canvas'), gctx = glw.getContext('2d');
let L = {};

const WALL = typeof WALLPAPER !== 'undefined' && WALLPAPER;
function layout(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const vw = innerWidth, vh = innerHeight;
  let W = WALL ? vw : Math.min(vw, vh * 9 / 16), H = WALL ? vh : W * 16 / 9;
  const ox = WALL ? 0 : (vw - W) / 2, oy = WALL ? 0 : (vh - H) / 2;
  cv.width = vw * dpr; cv.height = vh * dpr; cv.style.width = vw + 'px'; cv.style.height = vh + 'px';
  const COLS = 84;
  const cw = W / COLS, fs = cw / 0.6, ch = fs * 0.92;
  const sceneH = WALL ? H : H * 0.675;
  const ROWS = Math.ceil(sceneH / ch);
  scn.width = Math.ceil(W * dpr); scn.height = Math.ceil(sceneH * dpr);
  glw.width = Math.ceil(scn.width / 5); glw.height = Math.ceil(scn.height / 5);
  const S = WALL ? Math.min(sceneH / 4.6, W * 0.30) : sceneH / 4.6;
  L = { dpr, W, H, ox, oy, COLS, ROWS, cw, ch, fs, sceneH, S,
        OXc: COLS * (WALL ? 0.5 : 0.47), OYr: (sceneH * (WALL ? 0.33 : 0.36)) / ch, Sx: S / cw, Sy: S / ch, D: 7 };
  grid = makeGrid(COLS * ROWS);
}
addEventListener('resize', layout);

/* ---------- grade com z-buffer ---------- */
let grid;
function makeGrid(n){ return { z: new Float32Array(n), c: new Array(n), r: new Uint8ClampedArray(n), g: new Uint8ClampedArray(n), b: new Uint8ClampedArray(n), a: new Float32Array(n), used: [] }; }
function clearGrid(){ const G = grid; G.z.fill(-1e9); for (const i of G.used) G.c[i] = null; G.used.length = 0; }
function plot(col, row, z, chr, rgb, a, bri){
  col = Math.round(col); row = Math.round(row);
  if (col < 0 || row < 0 || col >= L.COLS || row >= L.ROWS) return;
  const i = row * L.COLS + col, G = grid;
  if (z <= G.z[i]) return;
  if (G.c[i] == null) G.used.push(i);
  G.z[i] = z; G.c[i] = chr;
  const k = bri == null ? 1 : bri;
  G.r[i] = rgb[0] * k; G.g[i] = rgb[1] * k; G.b[i] = rgb[2] * k; G.a[i] = a;
}
function proj(p, o){
  const k = L.D / (L.D - p[2]);
  o[0] = L.OXc + L.Sx * p[0] * k; o[1] = L.OYr - L.Sy * p[1] * k; o[2] = p[2];
  return o;
}
function line(a, b, rgb, alpha, bri, flat){
  const dc = b[0] - a[0], dr = b[1] - a[1];
  const n = Math.max(1, Math.ceil(Math.max(Math.abs(dc), Math.abs(dr))));
  const chr = slopeChar(dc * L.cw, dr * L.ch, flat);
  for (let i = 0; i <= n; i++){ const k = i / n; plot(a[0] + dc * k, a[1] + dr * k, lerp(a[2], b[2], k) + 0.001, chr, rgb, alpha, bri); }
}
function mixc(a, b, k){ return [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)]; }
const WHITE = [255, 255, 255];

/* ============================================================
   peças
   ============================================================ */
const NU = 46, NTH = 168;
const START = [];                          // posições de partida das letras (montagem)
(function(){ const R = rng(7); for (let i = 0; i < NU * NTH; i++){
  const ang = R() * TAU, rad = Math.pow(R(), 0.6);
  START.push([0.5 + Math.cos(ang) * rad * 0.42 + (R() - .5) * .1, 0.30 + Math.sin(ang) * rad * 0.22 + (R() - .5) * .1, R() * 0.9]);
} })();

const tmp = [0, 0, 0], tmpN = [0, 0, 0], pr = [0, 0, 0], prof = [0, 0], prof2 = [0, 0];

function drawBell(t){
  const P = pose(t), assembling = t < 1.6;
  const flash = (t > 2.05 && t < 3.6) ? Math.exp(-Math.max(0, t - 2.25) * 2.4) * sstep(2.05, 2.25, t) : 0;
  const Lx = -0.42, Ly = 0.62, Lz = 0.66;
  for (let iu = 0; iu < NU; iu++){
    const u = (iu + 0.5) / NU;
    const c = squeeze(t - RIM_LAG * u);
    const pal = PALETTES[paletteAt(t, u)];
    for (let it = 0; it < NTH; it++){
      const th0 = it / NTH * TAU, th = th0 + SPIN * t;
      bellProfile(u, th, c, prof);
      bellProfile(Math.min(1, u + 0.01), th, c, prof2);
      const dr = prof2[0] - prof[0], dy = prof2[1] - prof[1];
      let nr = -dy, ny = dr; const nl = Math.hypot(nr, ny) || 1; nr /= nl; ny /= nl;
      const ct = Math.cos(th), st = Math.sin(th);
      carry(prof[0] * ct, prof[1], prof[0] * st, P, tmp);
      carryN(nr * ct, ny, nr * st, P, tmpN);
      proj(tmp, pr);
      const id = iu * NTH + it;
      const facing = tmpN[2];
      // montagem: letras voando de pontos espalhados
      if (assembling){
        const s = START[id], k = smooth((t - 0.05 - s[2] * 0.7) / 0.75);
        if (k < 1){
          const sc = s[0] * L.COLS, sr = s[1] * L.ROWS;
          const col = lerp(sc, pr[0], k), row = lerp(sr, pr[1], k);
          if (hash(id * 3 + 1) < 0.07 && t > s[2] * 0.4) plot(col, row, pr[2] - 3, hash(id) < 0.5 ? '+' : '.', [220, 230, 255], 0.55 + 0.45 * k);
          continue;
        }
      }
      let chr, rgb, bri, alpha = 1;
      const stripe = sstep(0.38, 0.62, 0.5 + 0.5 * Math.cos(PETALS * th0));
      let base = mixc(pal[0], pal[1], stripe);
      if (flash > 0) base = mixc(base, [235, 240, 255], flash * 0.9);
      if (facing < -0.02){                         // interior do sino: linhas verticais
        const ct2 = Math.cos(th), st2 = Math.sin(th);
        carry(prof2[0] * ct2, prof2[1], prof2[0] * st2, P, tmpN); const p2 = proj(tmpN, [0, 0, 0]);
        chr = (it % 2) ? slopeChar((p2[0] - pr[0]) * L.cw, (p2[1] - pr[1]) * L.ch, '-') : (u > 0.5 ? ':' : '.');
        rgb = mixc(base, pal[3], 0.4); bri = 0.42; alpha = 0.9;
      } else if (u > 0.93){                        // borda (anel do sino)
        const th2 = th + 0.02; bellProfile(u, th2, c, prof2);
        carry(prof2[0] * Math.cos(th2), prof2[1], prof2[0] * Math.sin(th2), P, tmpN); const p2 = proj(tmpN, [0, 0, 0]);
        chr = slopeChar((p2[0] - pr[0]) * L.cw, (p2[1] - pr[1]) * L.ch, '_');
        rgb = base; bri = 0.95;
      } else if (facing < 0.2){                    // contorno
        chr = slopeChar(tmpN[1], tmpN[0], '-');
        rgb = base; bri = 0.9;
      } else {
        const lam = Math.max(0, tmpN[0] * Lx + tmpN[1] * Ly + tmpN[2] * Lz);
        const b = clamp((0.18 + 0.82 * lam) * (0.55 + 0.45 * stripe) + 0.25 * flash, 0, 0.999);
        chr = letter(b, id + (u > 0.6 ? 0 : 7));
        rgb = base; bri = 0.5 + 0.5 * b;
      }
      plot(pr[0], pr[1], pr[2], chr, rgb, alpha, bri);
    }
  }
}

function drawTentacles(t){
  const g = dropped(t, TENT_T0, TENT_DROP); if (g <= 0) return 0;
  const N = 52, a = [0, 0, 0], b = [0, 0, 0];
  for (let kk = 0; kk < N_TENT * 2; kk++){
    const k = kk >> 1, strand = kk & 1;
    const ph = k * 2.399, th0 = k / N_TENT * TAU + 0.11 + strand * 0.075;
    let prev = null;
    for (let i = 0; i <= N; i++){
      const s = i / N, reach = TENT_LEN * g * s;
      const td = t - RIM_LAG - TENT_LAG * reach;
      const c = squeeze(td);
      const th = th0 + SPIN * td + 0.55 * s * Math.sin(0.8 * t - 2.6 * reach + ph);
      let r = 0.97 * BELL_R * (1 - 0.34 * c) * (1 - 0.22 * smooth(1.1 * reach / TENT_LEN * 2)) + strand * 0.05;
      r += 0.13 * Math.pow(s, 0.7) * (strand ? 1.15 : 1) * Math.sin(1.7 * t - 6.5 * reach / TENT_LEN + 3 * ph);
      const y = -reach * (1 + 0.08 * c) + 0.02 * s * Math.sin(2.3 * t - 7 * reach + ph);
      const P = pose(td);
      carry(r * Math.cos(th), y, r * Math.sin(th), P, tmp);
      const cur = proj(tmp, (i & 1) ? a : b).slice();
      if (prev){
        const pal = PALETTES[paletteAt(t, 1 + s * 1.6)];
        const depth = clamp(0.8 + 0.25 * cur[2], 0.5, 1);
        line(prev, cur, pal[3], 1, depth * (1 - 0.25 * s) * (strand ? 0.8 : 1));
      }
      prev = cur;
    }
  }
  return N_TENT;
}

function drawArms(t){
  const g = dropped(t, ARM_T0, ARM_DROP); if (g <= 0) return;
  const NU2 = 34, NV = 9;
  for (let k = 0; k < N_ARMS; k++){
    const phk = k / N_ARMS * TAU + 0.4;
    let edgeL = null, edgeR = null;
    for (let iu = 0; iu <= NU2; iu++){
      const u = iu / NU2, reach = ARM_LEN * g * u;
      const td = t - 0.12 - 0.35 * reach;
      const P = pose(td), c = squeeze(td);
      const phi = phk + SPIN * 0.6 * td + 0.35 * Math.sin(0.7 * t - 2.2 * reach + k);
      const rad = 0.10 + 0.06 * Math.sin(1.3 * t + k + 3 * u);
      const cx = rad * Math.cos(phi) + 0.12 * u * u * Math.sin(0.9 * t - 3 * reach + k);
      const cz = rad * Math.sin(phi);
      const cy = 0.05 - reach * (1 + 0.06 * c);
      const w = 0.27 * (1 - 0.55 * u) * (1 + 0.28 * Math.sin(9 * u - 3.1 * t + k * 1.7)) * (0.5 + 0.5 * g);
      const psi = phi + Math.PI / 2 + 1.3 * u + 0.4 * Math.sin(0.5 * t + k);
      const ex = Math.cos(psi), ez = Math.sin(psi);
      const pal = PALETTES[paletteAt(t, 1.0 + u * 1.2)];
      const facing = Math.abs(Math.sin(psi - 0.3));
      for (let iv = 0; iv <= NV; iv++){
        const v = iv / NV * 2 - 1;
        carry(cx + v * w * ex, cy + 0.03 * Math.sin(5 * v + 3 * t), cz + v * w * ez, P, tmp);
        const p = proj(tmp, [0, 0, 0]);
        if (iv === 0 || iv === NV){
          const e = iv === 0 ? 'L' : 'R', prev = e === 'L' ? edgeL : edgeR;
          if (prev) line(prev, p, pal[2], 0.95, 0.6);
          if (e === 'L') edgeL = p; else edgeR = p;
          continue;
        }
        const b = clamp((0.35 + 0.6 * facing) * (1 - 0.6 * Math.abs(v)) * (1 - 0.35 * u) + 0.15, 0, 0.99);
        plot(p[0], p[1], p[2], letter(b, (k * 97 + iu) * 31 + iv), pal[2], 1, 0.55 + 0.5 * b);
      }
    }
  }
}

/* cintilações em anel */
const GLINT_T0 = []; for (let tb = GLINT_FROM; tb <= LAST_BEAT + 1e-6; tb += PERIOD) GLINT_T0.push(tb + 0.3);
const GLINT = GLINT_T0.map((_, n) => { const R = rng(14 + n * 7); return Array.from({ length: N_GLINTS }, () => [R(), R()]); });
function drawGlints(t){
  let count = 0; const o = [0, 0, 0], ex = [0, 0, 0], ez = [0, 0, 0];
  GLINT_T0.forEach((t0, n) => {
    const age = t - t0; if (age < 0 || age >= GLINT_LIFE) return;
    const P = pose(t0);
    carry(0, 0, 0, P, o); carryN(1, 0, 0, P, ex); carryN(0, 0, 1, P, ez);
    const r = 0.9 * BELL_R + 1.15 * (1 - Math.exp(-1.5 * age));
    const fade = Math.pow(1 - age / GLINT_LIFE, 0.6);
    for (let i = 0; i < N_GLINTS; i++){
      const G = GLINT[n][i], a = (G[0] + i) * TAU / N_GLINTS;
      const p = [o[0] + r * (Math.cos(a) * ex[0] + Math.sin(a) * ez[0]),
                 o[1] + r * (Math.cos(a) * ex[1] + Math.sin(a) * ez[1]) - 0.10 * age - 0.05 * age * age,
                 o[2] + r * (Math.cos(a) * ex[2] + Math.sin(a) * ez[2])];
      const tw = clamp(Math.sin(t * (5 + 6 * G[1]) + G[0] * 50), 0, 1);
      proj(p, pr); plot(pr[0], pr[1], pr[2] + 0.5, tw > 0.6 ? '*' : '+', WHITE, fade, 0.75 + 0.25 * tw);
      count++;
    }
  });
  return count;
}

/* fogos de artifício finais */
function fibSphere(n){ const out = [], ga = Math.PI * (3 - Math.sqrt(5)); for (let i = 0; i < n; i++){ const y = 1 - 2 * (i + .5) / n, r = Math.sqrt(1 - y * y); out.push([Math.cos(ga * i) * r, y, Math.sin(ga * i) * r]); } return out; }
const BURSTS = (function(){
  const R = rng(12), out = [];
  T_FINALE.forEach(tb => {
    const t0 = tb + 0.30, P = pose(t0), centre = carry(0, 0.30, 0, P, [0, 0, 0]);
    const dirs = fibSphere(BURST_SPARKS);
    for (let i = dirs.length - 1; i > 0; i--){ const j = (R() * (i + 1)) | 0; [dirs[i], dirs[j]] = [dirs[j], dirs[i]]; }
    dirs.forEach(d => {
      let w = [d[0], d[1] + 0.10, -Math.abs(d[2]) * 0.55]; const l = Math.hypot(...w); w = w.map(x => x / l);
      const sp = BURST_SPEED * (0.45 + 0.55 * R());
      out.push({ t0, start: centre.map((c, k) => c + 0.3 * w[k]), vel: w.map(x => x * sp),
                 ink: SPARK_INK[(R() * SPARK_INK.length) | 0], life: 1.4 + 0.8 * R(), seed: R() * TAU });
    });
  });
  return out;
})();
function sparkAt(s, age, o){
  const k = (1 - Math.exp(-DRAG * Math.max(age, 0))) / DRAG;
  o[0] = s.start[0] + s.vel[0] * k; o[1] = s.start[1] + s.vel[1] * k - 0.07 * age * age; o[2] = s.start[2] + s.vel[2] * k;
  return o;
}
function drawSparks(t){
  let count = 0; const h = [0, 0, 0], b = [0, 0, 0], ph = [0, 0, 0], pb = [0, 0, 0];
  for (const s of BURSTS){
    const age = t - s.t0; if (age < 0 || age > s.life) continue;
    count++;
    const dying = age > s.life - 0.6, fade = dying ? (s.life - age) / 0.6 : 1;
    proj(sparkAt(s, age, h), ph);
    const fl = Math.sin(age * 38 + s.seed * 9);
    const head = dying ? (fl > 0.3 ? '.' : (fl > -0.4 ? ':' : ' ')) : (fl > 0 ? '*' : '+');
    for (let k = 1; k <= TAILS; k++){

  }
  c.textAlign = 'left';
  return { tent, sparks: gl + sp, letters: G.used.length };
}

let t0 = performance.now(), last = 0, paused = false, pauseAt = 0;
function frame(now){
  requestAnimationFrame(frame);
  if (now - last < 1000 / FPS - 2) return;
  last = now;
  const t = paused ? pauseAt : ((now - t0) / 1000) % LOOP;

  const dimOut = 1 - 0.82 * sstep(OUTRO, OUTRO + 1.4, t);
  const fadeIn = sstep(0, 0.25, t), endFade = 1 - sstep(LOOP - 0.5, LOOP, t);
  const dim = dimOut * fadeIn * endFade;

  const st = renderScene(t, dim);
  const d = L.dpr;
  // brilho: cena reduzida e ampliada por cima, em modo aditivo
  gctx.setTransform(1, 0, 0, 1, 0, 0);
  gctx.clearRect(0, 0, glw.width, glw.height);
  gctx.imageSmoothingEnabled = true;
  gctx.drawImage(scn, 0, 0, glw.width, glw.height);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(d, 0, 0, d, L.ox * d, L.oy * d);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, L.W, L.H); ctx.clip();
  ctx.drawImage(scn, 0, 0, L.W, L.sceneH);
  ctx.globalCompositeOperation = 'lighter'; ctx.imageSmoothingEnabled = true;
  ctx.globalAlpha = 0.85; ctx.drawImage(glw, 0, 0, L.W, L.sceneH);
  ctx.globalAlpha = 0.35; ctx.drawImage(glw, -L.cw, -L.ch * 0.5, L.W + 2 * L.cw, L.sceneH + L.ch);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  const beats = Math.max(0, beatIndex(t) + 1);
  if (!WALL){
    drawHUD(ctx, t, { beats, tent: st.tent, colours: coloursCount(t), sparks: st.sparks, letters: st.letters }, dim);
    drawEditor(ctx, t, Math.max(0.18, dim));
  }
  ctx.restore();
}

cv.addEventListener('click', () => {
  const now = performance.now();
  if (!paused){ pauseAt = ((now - t0) / 1000) % LOOP; paused = true; }
  else { t0 = now - pauseAt * 1000; paused = false; }
});
const QS = new URLSearchParams(location.search);
if (QS.has('t')){ paused = true; pauseAt = parseFloat(QS.get('t')) || 0; }
layout();
requestAnimationFrame(frame);
</script>

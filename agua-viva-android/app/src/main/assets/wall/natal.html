<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Árvore de Natal</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-tap-highlight-color:transparent}canvas{position:absolute;left:0;top:0;display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const WALLPAPER = true;
/* ============================================================
   ÁRVORE DE NATAL — se monta sozinha, girando: chão, tronco,
   copa de baixo para cima, guirlanda, bolas, estrela, presentes
   e a mensagem digitada (21 s em loop)
   ============================================================ */
const SCENE = {
  title: 'árvore de natal · se monta sozinha', file: 'arvore_natal.py', loop: 21, cols: 120,

  T_GROUND: [0.0, 1.0], T_TRUNK: [0.6, 1.3], T_TREE: [1.2, 6.0], T_LIGHTS: [6.0, 10.0], T_ORN: [6.6, 10.4],
  T_STAR: [10.2, 11.0], T_GIFT: [10.6, 12.6], T_TEXT: [12.6, 15.6], T_END: 19.4,
  WORD: 'FELIZNATALBOASFESTASJOVONE',
  GREETING: 'FELIZ NATAL 2026',
  TIERS: [[0.00, 0.40, 0.00, 0.30], [0.30, 0.70, 0.22, 0.45], [0.60, 1.00, 0.24, 0.60]],   // topo, base, raio inicial, raio máx

  init(){
    const R = rng(7);
    this.pts = [];
    const N = [5200, 8400, 12400];
    this.TIERS.forEach(([top, bot, r0, rmax], k) => {
      for (let i = 0; i < N[k]; i++){
        const u = Math.pow(R(), k === 0 ? 0.85 : 0.75);
        const a = R() * TAU;
        const hb = top + (bot - top) * u;
        const lobe = 1 + 0.12 * Math.sin(a * 9 + k * 1.7) * u * u;
        const droop = 0.045 * Math.sin(a * 9 + k * 1.7) * Math.pow(u, 4);
        const rr = rmax * (r0 + (1 - r0) * Math.pow(u, k === 0 ? 1.15 : 1)) * lobe * Math.sqrt(0.82 + 0.18 * R());
        this.pts.push({ h: hb + droop, a, r: rr, u, k, id: i * 3 + k, snow: R() < 0.035 && u > 0.6, inner: R() < 0.18 });
      }
    });
    // guirlanda: espiral de luzes de baixo para cima
    this.lights = [];
    for (let i = 0; i < 176; i++){
      const s = i / 176, h = 0.97 - s * 0.92;
      this.lights.push({ s, h, a: s * TAU * 6.5, ink: [hex('#ffd56a'), hex('#ffb347'), hex('#fff2c8'), hex('#ff6a4a')][(R() * 4) | 0], ph: R() * TAU });
    }
    // bolas
    this.orns = [];
    for (let i = 0; i < 46; i++){
      const h = 0.12 + 0.84 * Math.pow(R(), 0.8);
      this.orns.push({ h, a: R() * TAU, t: this.T_ORN[0] + (1 - h) * 0 + R() * (this.T_ORN[1] - this.T_ORN[0]), ink: [hex('#ff2a2a'), hex('#e01818'), hex('#ffcc33'), hex('#ff3a5a')][(R() * 4) | 0], big: 0.8 + 0.6 * R() });
    }
    // presentes em volta do tronco
    this.gifts = [
      { a: 0.3, d: 0.40, s: 0.075, h: 0.09, box: hex('#2a4cff'), rib: hex('#ffd23a'), t: 10.6 },
      { a: 1.6, d: 0.46, s: 0.06, h: 0.11, box: hex('#ff2a3a'), rib: hex('#ffffff'), t: 10.9 },
      { a: 2.7, d: 0.38, s: 0.08, h: 0.07, box: hex('#ffcc33'), rib: hex('#ff2a3a'), t: 11.2 },
      { a: 3.9, d: 0.44, s: 0.055, h: 0.10, box: hex('#ff5ab4'), rib: hex('#ffffff'), t: 11.5 },
      { a: 5.0, d: 0.42, s: 0.07, h: 0.08, box: hex('#2fd2a0'), rib: hex('#ff2a3a'), t: 11.8 },
      { a: 5.8, d: 0.50, s: 0.05, h: 0.06, box: hex('#ff2a3a'), rib: hex('#ffd23a'), t: 12.1 },
    ];
    this.gpts = this.gifts.map((g, gi) => {
      const out = [], Rg = rng(100 + gi);
      for (let i = 0; i < 700; i++){
        const face = (Rg() * 5) | 0, p = Rg() * 2 - 1, q = Rg() * 2 - 1;
        let x, y, z;
        if (face === 0){ x = p; y = 1; z = q; } else if (face === 1){ x = 1; y = q; z = p; } else if (face === 2){ x = -1; y = q; z = p; } else if (face === 3){ x = p; y = q; z = 1; } else { x = p; y = q; z = -1; }
        const rib = Math.abs(x) < 0.16 || Math.abs(z) < 0.16;
        out.push([x, y, z, rib, (Rg() * 1e6) | 0]);
      }
      return out;
    });
    this.snow = Array.from({ length: 700 }, () => [R(), R(), 0.6 + 2.2 * R(), R() * TAU, R()]);
  },

  frame(t, T){
    const C = G.cols, Rr = G.rows, asp = L.asp;
    const ramp = (a, b) => clamp((t - a) / (b - a), 0, 1), ease = x => 1 - Math.pow(1 - x, 3);
    const groundRow = Math.round(Rr * 0.86);
    const Sc = Math.min(Rr * 0.6, C / (2 * 0.66 * asp));                         // linhas por unidade de altura
    const cx = C * 0.5, baseRow = groundRow - Sc * 0.075;
    const rot = T * 0.26;                         // giro
    const PITCH = 0.16, cp = Math.cos(PITCH), sp = Math.sin(PITCH);
    const end = 1 - ramp(this.T_END, this.T_END + 1.0);
    const proj = (x, y, z) => {                   // y para cima a partir da base da árvore
      const cr = Math.cos(rot), sr = Math.sin(rot);
      const xr = x * cr - z * sr, zr = x * sr + z * cr;
      const y1 = y * cp + zr * sp, z1 = -y * sp + zr * cp;
      return [cx + xr * Sc * asp, baseRow - y1 * Sc, z1];
    };
    const zp = z => 1000 + Math.round(z * 800);

    /* neve de fundo */
    for (const s of this.snow){
      if (s[4] > 0.75) continue;
      const y = ((s[1] * Rr + T * s[2]) % Rr + Rr) % Rr, x = s[0] * C + Math.sin(T * 0.6 + s[3]) * 1.5;
      put(x, y, s[4] < 0.06 ? '+' : '.', [235, 240, 255], 0.35 + 0.4 * s[4], 1);
    }

    /* chão */
    const g = ease(ramp(...this.T_GROUND));
    if (g > 0) for (let r = groundRow; r < Rr; r++) for (let c = 0; c < C; c++){
      const v = h2(c, r);
      if (v < 0.75 * g) put(c, r, v < 0.06 ? '+' : this.WORD[(c * 7 + r * 13) % this.WORD.length], mix(hex('#1a2a6a'), hex('#4a5aa8'), h2(r, c) * 0.6), 0.22 + 0.25 * (r - groundRow) / (Rr - groundRow), 10);
    }

    /* tronco */
    const tg = ease(ramp(...this.T_TRUNK));
    if (tg > 0){
      const th = 0.10 * tg;
      for (let i = 0; i < 900; i++){
        const a = h1(i) * TAU, y = -0.075 + h1(i + 7) * (th + 0.075) , rr = 0.05;
        const [c, r, z] = proj(Math.cos(a) * rr, y, Math.sin(a) * rr);
        const lit = 0.5 + 0.5 * Math.cos(a + rot + 2.2);
        put(c, r, this.WORD[i % this.WORD.length], mix(hex('#4a2410'), hex('#c87a3a'), lit), end, zp(z));
      }
    }

    /* copa: cresce de baixo para cima */
    const grow = ramp(...this.T_TREE);
    const reveal = 1 - ease(grow) * 1.02;         // altura (0 topo .. 1 base) já revelada
    const Lx = -0.55, Ly = 0.45, Lz = 0.70;
    let nPts = 0;
    if (grow > 0) for (const p of this.pts){
      if (p.h < reveal) continue;
      const fresh = clamp((p.h - reveal) / 0.06, 0, 1);
      const y = (1 - p.h) * 1.0 + 0.08;
      const pr = p.inner ? p.r * 0.6 : p.r;
      const x = Math.cos(p.a) * pr, z = Math.sin(p.a) * pr;
      const [c, r, zz] = proj(x, y, z);
      // normal do cone: radial com um pouco para cima
      const ca = Math.cos(p.a + rot), sa = Math.sin(p.a + rot);
      const nx = ca * 0.85, ny = 0.5, nz = sa * 0.85;
      const lam = clamp(nx * Lx + ny * Ly + nz * Lz, 0, 1);
      let b = 0.3 + 0.7 * lam;
      if (p.u > 0.9) b *= 0.6;                    // saia de cada camada fica escura por baixo
      if (p.k > 0){ const above = this.TIERS[p.k - 1][1]; if (p.h > above - 0.01 && p.h < above + 0.09) b *= 0.3 + 0.7 * clamp((p.h - above) / 0.09, 0, 1); }
      if (p.inner) b *= 0.45;
      let rgb = mix(hex('#0a3a16'), hex('#62ff74'), b);
      let ch = this.WORD[p.id % this.WORD.length];
      if (p.snow && b > 0.4){ rgb = hex('#eef6ff'); ch = (p.id % 3) ? '*' : 'o'; }
      if (fresh < 1) rgb = mix(hex('#ffffff'), rgb, fresh);
      put(c, r, ch, rgb, end * (0.7 + 0.3 * b), zp(zz));
      nPts++;
    }
    const radiusAt = h => {                        // raio externo da árvore na altura h (0 topo .. 1 base)
      let m = 0;
      for (const [top, bot, r0, rmax] of this.TIERS){ const u = (h - top) / (bot - top); if (u >= 0 && u <= 1) m = Math.max(m, rmax * (r0 + (1 - r0) * u)); }
      return m;
    };

    /* guirlanda de luzes */
    let lit = 0;
    const lt = ramp(...this.T_LIGHTS);
    for (const L0 of this.lights){
      if (L0.s > lt || L0.h < reveal) continue;
      const rr = radiusAt(L0.h) * 1.02;
      const [c, r, z] = proj(Math.cos(L0.a) * rr, (1 - L0.h) + 0.08, Math.sin(L0.a) * rr);
      const tw = 0.55 + 0.45 * Math.sin(T * 4 + L0.ph);
      const front = z > -0.05;
      put(c, r, tw > 0.75 ? '*' : 'o', L0.ink, end * (front ? tw : tw * 0.35), zp(z) + 5);
      if (front && tw > 0.8) addc(c, r - 1, "'", L0.ink, 0.35 * tw * end, zp(z) + 5);
      lit++;
    }
    // fio da guirlanda
    if (lt > 0) for (let i = 0; i < 900; i++){
      const s = i / 900; if (s > lt) break;
      const h = 0.97 - s * 0.92; if (h < reveal) continue;
      const rr = radiusAt(h) * 1.0, a = s * TAU * 6.5;
      const [c, r, z] = proj(Math.cos(a) * rr, (1 - h) + 0.08, Math.sin(a) * rr);
      if (z > -0.05) put(c, r, '~', hex('#c8a040'), 0.55 * end, zp(z) + 3);
    }

    /* bolas */
    for (const o of this.orns){
      const k = ease(clamp((t - o.t) / 0.35, 0, 1));
      if (k <= 0 || o.h < reveal) continue;
      const rr = radiusAt(o.h) * 0.98;
      const [c, r, z] = proj(Math.cos(o.a) * rr, (1 - o.h) + 0.08, Math.sin(o.a) * rr);
      if (z < -0.1) continue;
      const rad = (0.9 + 0.5 * o.big) * k * (0.75 + 0.35 * z);
      disc(c, r, rad, (cc, rr2, d, dx, dy) => {
        const hl = clamp(-dx * 0.6 - dy * 0.7 + 0.4, 0, 1);
        put(cc, rr2, d < 0.45 && hl > 0.6 ? 'o' : '@', mix(mul(o.ink, 0.55), [255, 240, 220], hl * hl * 0.7), end, zp(z) + 10);
      });
    }

    /* estrela no topo com raios */
    const st = ramp(...this.T_STAR);
    if (st > 0 && reveal <= 0.02){
      const [sc, sr, sz] = proj(0, 1.08, 0);
      const k = ease(st), pulse = 0.8 + 0.2 * Math.sin(T * 5);
      const STAR = ['  .  ', ' *+* ', '*+#+*', ' *+* ', ' / \\ '];
      STAR.forEach((ln, i) => { for (let j = 0; j < ln.length; j++) if (ln[j] !== ' ') put(sc - 2 + j, sr - 3 + i, ln[j], mix(hex('#fff2b0'), hex('#ffcc33'), i / 4), k * end, 3000); });
      for (let n = 0; n < 22; n++){                  // raios girando devagar
        const a = n / 22 * TAU + T * 0.15, len = (8 + 10 * h1(n)) * k;
        for (let s = 3; s < len; s += 0.9){
          const c = sc + Math.cos(a) * s * asp, r = sr - 1 + Math.sin(a) * s;
          addc(c, r, slopeChar(Math.cos(a) * L.cw, Math.sin(a) * L.ch, '-'), hex('#ffe08a'), 0.45 * (1 - s / len) * pulse * end, 2900);
        }
      }
    }

    /* presentes */
    this.gifts.forEach((gf, gi) => {
      const k = ease(clamp((t - gf.t) / 0.45, 0, 1));
      if (k <= 0) return;
      for (const [x, y, z, rib, id] of this.gpts[gi]){
        const X = Math.cos(gf.a) * gf.d + x * gf.s, Z = Math.sin(gf.a) * gf.d + z * gf.s, Y = -0.075 + (y + 1) * 0.5 * gf.h * k;
        const [c, r, zz] = proj(X, Y, Z);
        const shade = y === 1 ? 1 : 0.55 + 0.35 * Math.cos(rot + gf.a + (x === 1 ? 0 : x === -1 ? Math.PI : z === 1 ? Math.PI / 2 : -Math.PI / 2) - 1);
        put(c, r, rib ? '#' : this.WORD[id % this.WORD.length], mul(rib ? gf.rib : gf.box, clamp(shade, 0.3, 1)), end, zp(zz) + 2);
      }
    });

    /* mensagem digitada */
    const tx = ramp(...this.T_TEXT);
    if (tx > 0){
      const n = Math.floor(tx * this.GREETING.length), s = this.GREETING.slice(0, n) + (n < this.GREETING.length && (T * 3 | 0) % 2 ? '_' : '');
      const spaced = s.split('').join(' ');
      const c0 = Math.round(cx - (this.GREETING.length * 2 - 1) / 2), r0 = groundRow + 2;
      for (let c = c0 - 3; c < c0 + this.GREETING.length * 2 + 3; c++) put(c, r0, ' ', [0, 0, 0], 1, 3500);
      for (let i = 0; i < spaced.length; i++) if (spaced[i] !== ' ') put(c0 + i, r0, spaced[i], hex('#ffcc55'), end, 3600);
    }

    /* neve na frente */
    for (const s of this.snow){
      if (s[4] <= 0.75) continue;
      const y = ((s[1] * Rr + T * s[2] * 1.4) % Rr + Rr) % Rr, x = s[0] * C + Math.sin(T * 0.8 + s[3]) * 2;
      put(x, y, s[4] > 0.97 ? '*' : (s[4] > 0.88 ? '+' : '.'), [255, 255, 255], 0.55 + 0.4 * s[4], 4000);
    }

    const deg = ((rot * 180 / Math.PI) % 360).toFixed(2);
    return { stats: [['rotação', deg + '°'], ['luzes', lit], ['bolas', this.orns.filter(o => t > o.t).length], ['pontos', nPts]],
             dim: sstep(0, 0.4, t) * (1 - sstep(20.4, 21, t)), glow: 0.85,
             bg: [[0, [1, 2, 6]], [0.8, [4, 6, 16]], [0.86, [6, 10, 30]], [1, [10, 14, 40]]] };
  },
};

const CODE = String.raw`# arvore_natal.py - ASCII christmas tree that builds itself, spinning
import numpy as np, math

COLS, FPS, SECS = 120, 30, 21
WORD = "FELIZNATALBOASFESTASJOVONE"                     # every leaf is a letter of this
GREETING = "FELIZ NATAL 2026"
rng = np.random.default_rng(7)

# ---------- timeline (seconds) ----------
T_GROUND = (0.0, 1.0)        # ground fades in
T_TRUNK = (0.6, 1.3)         # trunk rises
T_TREE = (1.2, 6.0)          # tree grows bottom -> top
T_LIGHTS = (6.0, 10.0)       # garland wraps upward
T_ORN = (6.6, 10.4)          # ornaments pop in
T_STAR = (10.2, 11.0)        # star + rays
T_GIFT = (10.6, 12.6)        # gift boxes pop in
T_TEXT = (12.6, 15.6)        # greeting types out
T_END = 19.4                 # clear for loop


def ramp(t, a, b):
    return float(np.clip((t - a) / (b - a), 0, 1))


def ease(x):
    return 1 - (1 - x) ** 3


# ---------- tree geometry (h: 0 top .. 1 bottom) ----------
# 3 big tiers, sharp tip, each tier's skirt overlaps the next -> dark
TIER_SPANS = [(0.00, 0.40, 0.00), (0.30, 0.70, 0.22), (0.60, 1.00, 0.24)]
TIER_RMAX = [0.30, 0.45, 0.60]   # (top, bottom, start radius ratio)


def tier_r(k, u):
    top, bot, r0 = TIER_SPANS[k]
    return TIER_RMAX[k] * (r0 + (1 - r0) * u ** (1.15 if k == 0 else 1))


parts = []
for k, (top, bot, r0) in enumerate(TIER_SPANS):
    n = [5200, 8400, 12400][k]
    u = rng.random(n) ** (0.85 if k == 0 else 0.75)
    a = rng.random(n) * 2 * np.pi
    hb = top + (bot - top) * u
    lobe = 1 + 0.07 * np.sin(a * 9 + k * 1.7) * u ** 2
    droop = 0.035 * np.sin(a * 9 + k * 1.7) * u ** 4                 # scallops
    r = tier_r(k, u) * lobe * np.sqrt(rng.uniform(0.82, 1.0, n))
    parts.append((hb + droop, a, r, u))


def spin(p, t):
    rot = 0.26 * t
    c, s = np.cos(rot), np.sin(rot)
    x, y, z = p[..., 0] * c - p[..., 2] * s, p[..., 1], p[..., 0] * s + p[..., 2] * c
    return np.stack([x, y * np.cos(0.16) + z * np.sin(0.16), z * np.cos(0.16) - y * np.sin(0.16)], -1)


def shade(a, rot, u):
    # cone normal, lit from the upper left; the underside of each skirt is dark
    n = np.stack([0.85 * np.cos(a + rot), np.full_like(a, 0.5), 0.85 * np.sin(a + rot)], -1)
    light = np.clip(n @ np.array([-0.55, 0.45, 0.70]), 0, 1)
    return (0.18 + 0.82 * light) * np.where(u > 0.88, 0.55, 1.0)


# ---------- garland, ornaments, star ----------
LIGHTS = 176
s = np.arange(LIGHTS) / LIGHTS
garland = np.stack([0.97 - 0.92 * s, 6.5 * 2 * np.pi * s], -1)      # spiral, bottom -> top
ORNAMENTS = rng.random((46, 2)) * [0.84, 2 * np.pi] + [0.12, 0]
STAR = ["  .  ", " *+* ", "*+#+*", " *+* ", " / \\ "]


def typed(t):
    n = int(ramp(t, *T_TEXT) * len(GREETING))
    cursor = "_" if n < len(GREETING) and int(3 * t) % 2 else ""
    return " ".join(GREETING[:n] + cursor)


def frame(t):
    grid = Grid(COLS, ROWS, zbuffer=True)
    grid.snow(FLAKES, t, layer="back")
    grid.ground(WORD, alpha=ease(ramp(t, *T_GROUND)))
    grid.trunk(height=0.10 * ease(ramp(t, *T_TRUNK)))
    reveal = 1 - 1.02 * ease(ramp(t, *T_TREE))
    for hb, a, r, u in parts:
        m = hb >= reveal
        grid.points(spin(cone(hb[m], a[m], r[m]), t), WORD, shade(a[m], 0.26 * t, u[m]))
    grid.lights(garland[: int(LIGHTS * ramp(t, *T_LIGHTS))], twinkle=np.sin(4 * t + PHASE))
    grid.ornaments(ORNAMENTS, pop=ramp(t, *T_ORN))
    grid.star(STAR, rays=22, alpha=ease(ramp(t, *T_STAR)))
    grid.gifts(GIFTS, pop=ramp(t, *T_GIFT))
    grid.text(typed(t), row=-6, colour="#ffcc55")
    grid.snow(FLAKES, t, layer="front")
    return grid.render(glow=0.85, fade=1 - ramp(t, T_END, T_END + 1))


if __name__ == "__main__":
    run(frame, fps=FPS, seconds=SECS)
`;

"use strict";
/* ============================================================
   motor comum: grade de letras, brilho, painel e editor
   (cada página traz a sua cena em SCENE e o seu código em CODE)
   ============================================================ */
const FPS = 30, TAU = Math.PI * 2;
const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Roboto Mono", monospace';

const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const sstep = (a, b, x) => smooth((x - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
function hash(i){ i = Math.imul(i ^ 61 ^ (i >>> 16), 9); i ^= i >>> 4; i = Math.imul(i, 0x27d4eb2d); i ^= i >>> 15; return (i >>> 0) / 4294967296; }
const h1 = i => hash(Math.imul(i | 0, 374761393) ^ 0x5bd1e995);
const h2 = (i, j) => hash(Math.imul(i | 0, 73856093) ^ Math.imul(j | 0, 19349663));
const h3 = (i, j, k) => hash(Math.imul(i | 0, 73856093) ^ Math.imul(j | 0, 19349663) ^ Math.imul(k | 0, 83492791));
function rng(seed){ let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return (s >>> 0) / 4294967296; }; }
function noise1(x){ const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(h1(i), h1(i + 1), u); }
function noise2(x, y){
  const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  return lerp(lerp(h2(i, j), h2(i + 1, j), ux), lerp(h2(i, j + 1), h2(i + 1, j + 1), ux), uy);
}
const fbm1 = x => (noise1(x) * 0.5 + noise1(x * 2.03 + 7) * 0.25 + noise1(x * 4.01 + 13) * 0.125) / 0.875;
const fbm2 = (x, y) => (noise2(x, y) * 0.5 + noise2(x * 2.03 + 7, y * 2.03 + 3) * 0.25 + noise2(x * 4.01 + 13, y * 4.01 + 5) * 0.125) / 0.875;
const ridged = x => 1 - Math.abs(2 * fbm1(x) - 1);
function hex(h){ const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
const mix = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
function keyColor(keys, t){
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++){ const [t0, c0] = keys[i], [t1, c1] = keys[i + 1]; if (t <= t1) return mix(c0, c1, smooth((t - t0) / (t1 - t0))); }
  return keys[keys.length - 1][1];
}
const RAMP = [".`'", ":;,", "il!1|", "rtcz=+<>", "unxvjf{}[]", "aeosQ%", "$8B0&#", "@#$8B%"].map(s => s.split(''));
function letter(b, id){ const g = RAMP[clamp(b * RAMP.length | 0, 0, RAMP.length - 1)]; return g[(hash(id) * g.length) | 0]; }
function slopeChar(dx, dy, flat){
  let a = Math.abs(Math.atan2(dy, dx)); if (a > Math.PI / 2) a = Math.PI - a;
  if (a > 1.18) return '|';
  if (a < 0.40) return flat || '_';
  return (dx * dy < 0) ? '/' : '\\';
}

/* ---------- grade ---------- */
let L = {}, G = null;
function gridInit(cols, rows){
  const n = cols * rows;
  G = { cols, rows, n, ch: new Array(n).fill(''), r: new Uint8ClampedArray(n), g: new Uint8ClampedArray(n), b: new Uint8ClampedArray(n), a: new Float32Array(n), p: new Int16Array(n) };
}
function gclear(){ G.ch.fill(''); }
function idx(c, r){ c = Math.round(c); r = Math.round(r); return (c < 0 || r < 0 || c >= G.cols || r >= G.rows) ? -1 : r * G.cols + c; }
function put(c, r, chr, rgb, a = 1, p = 0){
  const i = idx(c, r); if (i < 0 || a <= 0.01) return;
  if (G.ch[i] && p < G.p[i]) return;
  G.ch[i] = chr; G.r[i] = rgb[0]; G.g[i] = rgb[1]; G.b[i] = rgb[2]; G.a[i] = Math.min(1, a); G.p[i] = p;
}
function addc(c, r, chr, rgb, a = 1, p = 0){
  const i = idx(c, r); if (i < 0 || a <= 0.01) return;
  if (!G.ch[i] || p > G.p[i]){ put(c, r, chr, rgb, a, p); return; }
  if (p < G.p[i]) return;
  const oa = G.a[i], wo = oa / (oa + a), wn = a / (oa + a);
  G.r[i] = G.r[i] * wo + rgb[0] * wn + rgb[0] * a * 0.25; G.g[i] = G.g[i] * wo + rgb[1] * wn + rgb[1] * a * 0.25; G.b[i] = G.b[i] * wo + rgb[2] * wn + rgb[2] * a * 0.25;
  if (a > oa) G.ch[i] = chr;
  G.a[i] = Math.min(1, oa + a);
}
function line(c0, r0, c1, r1, rgb, a = 1, p = 0, flat, fn = put){
  const dc = c1 - c0, dr = r1 - r0;
  const n = Math.max(1, Math.ceil(Math.max(Math.abs(dc), Math.abs(dr))));
  const chr = slopeChar(dc * L.cw, dr * L.ch, flat);
  for (let i = 0; i <= n; i++){ const k = i / n; fn(c0 + dc * k, r0 + dr * k, chr, rgb, a, p); }
}
function text(c, r, s, rgb, a = 1, p = 0){ for (let i = 0; i < s.length; i++) if (s[i] !== ' ') put(c + i, r, s[i], rgb, a, p); }
function disc(cc, rr, rad, fn){
  const asp = L.ch / L.cw;
  for (let r = Math.floor(rr - rad - 1); r <= rr + rad + 1; r++)
    for (let c = Math.floor(cc - rad * asp - 1); c <= cc + rad * asp + 1; c++){
      const dx = (c - cc) / asp, dy = r - rr, d = Math.hypot(dx, dy) / rad;
      if (d <= 1) fn(c, r, d, dx / rad, dy / rad);
    }
}
function makeStars(n, seed){ const R = rng(seed); return Array.from({ length: n }, () => [R(), R(), R(), R(), mix([200, 215, 255], [255, 236, 210], R())]); }
function stars(list, rowsMax, alpha, t, p = 0){
  if (alpha <= 0.02) return 0;
  let n = 0;
  for (const s of list){
    const tw = 0.4 + 0.6 * Math.max(0, Math.sin(t * (1 + s[3]) + s[2] * 9));
    put(s[0] * G.cols, s[1] * rowsMax, s[3] > 0.88 ? '+' : (tw > 0.85 ? '+' : '.'), s[4], alpha * tw, p); n++;
  }
  return n;
}

/* ---------- editor ---------- */
const KW = new Set(['def', 'return', 'for', 'in', 'if', 'not', 'continue', 'and', 'or', 'import', 'as', 'from', 'while', 'else', 'elif', 'lambda', 'None', 'True', 'False', 'is', 'yield', 'with', 'class']);
const COLK = { kw: '#ff7b72', fn: '#79c0ff', num: '#f2a65e', com: '#5d6877', str: '#a5d6ff', txt: '#d3dae3' };
function tokenize(s){
  const out = []; let m; const re = /(#.*$)|("[^"]*"|'[^']*')|(\b\d+\.?\d*(?:e-?\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)|(\s+)|(.)/g;
  while ((m = re.exec(s))){
    if (m[1]) out.push([m[1], COLK.com]);
    else if (m[2]) out.push([m[2], COLK.str]);
    else if (m[3]) out.push([m[3], COLK.num]);
    else if (m[4]){
      const w = m[4], next = /^\s*\(/.test(s.slice(re.lastIndex));
      const prev = out.length > 1 ? out[out.length - 2][0] : '';
      if (w === 'None' || w === 'True' || w === 'False') out.push([w, COLK.num]);
      else if (KW.has(w)) out.push([w, COLK.kw]);
      else if (prev === 'def' || prev === 'class' || next || w === 'np') out.push([w, COLK.fn]);
      else out.push([w, COLK.txt]);
    } else out.push([m[5] || m[6], COLK.txt]);
  }
  return out;
}
const SRC = CODE.split('\n'), TOK = SRC.map(tokenize);
const MARKS = (() => { const m = []; SRC.forEach((l, i) => { if (/^def |^class |^[A-Z_]+ = |^[A-Z_]+, /.test(l) && (m.length === 0 || i - m[m.length - 1] > 4)) m.push(i); }); return m; })();
function editorState(t){
  const n = MARKS.length, seg = SCENE.loop / n;
  const i = Math.min(n - 1, Math.floor(t / seg)), k = (t - i * seg) / seg;
  const l0 = MARKS[i], l1 = i + 1 < n ? MARKS[i + 1] : SRC.length - 1;
  const prev = i > 0 ? MARKS[i - 1] : 0;
  const top = lerp(prev - 3 + Math.min(6, l0 - prev), l0 - 3, sstep(0, 0.2, k));
  const cursor = l0 + Math.floor(sstep(0.15, 1, k) * Math.max(0, Math.min(l1 - l0 - 1, 14)));
  return { top, cursor };
}

/* ---------- canvas ---------- */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const scn = document.createElement('canvas'), sctx = scn.getContext('2d');
const glw = document.createElement('canvas'), gctx = glw.getContext('2d');
const WALL = typeof WALLPAPER !== 'undefined' && WALLPAPER;      // modo papel de parede: só a cena, tela cheia
function layout(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const vw = innerWidth, vh = innerHeight;
  const W = WALL ? vw : Math.min(vw, vh * 9 / 16), H = WALL ? vh : W * 16 / 9;
  cv.width = vw * dpr; cv.height = vh * dpr; cv.style.width = vw + 'px'; cv.style.height = vh + 'px';
  const COLS = SCENE.cols || 84, cw = W / COLS, fs = cw / 0.6, ch = fs * 0.92;
  const top = WALL ? 0 : H * 0.03, sceneH = WALL ? H : H * 0.675 - top;
  const ROWS = Math.floor(sceneH / ch);
  scn.width = Math.ceil(W * dpr); scn.height = Math.ceil(sceneH * dpr);
  glw.width = Math.ceil(scn.width / 5); glw.height = Math.ceil(scn.height / 5);
  L = { dpr, W, H, ox: WALL ? 0 : (vw - W) / 2, oy: WALL ? 0 : (vh - H) / 2, COLS, ROWS, cw, ch, fs, top, sceneH, asp: ch / cw };
  gridInit(COLS, ROWS);
}
addEventListener('resize', layout);

function drawTop(c, t){
  const W = L.W, H = L.H, y = L.top * 0.62;
  c.textBaseline = 'middle';
  c.font = `${(H * 0.0105).toFixed(1)}px ${MONO}`;
  c.textAlign = 'left'; c.fillStyle = '#7d8796'; c.fillText(SCENE.title, W * 0.022, y);
  c.textAlign = 'right'; c.fillStyle = '#58a6ff'; c.fillText('t ' + t.toFixed(2).padStart(5, '0') + 's', W * 0.977, y);
  c.textAlign = 'left';
}
function drawHUD(c, stats, letters, dim){
  const W = L.W, H = L.H, fs = H * 0.0098;
  c.globalAlpha = dim; c.textBaseline = 'alphabetic'; c.textAlign = 'left';
  c.font = `${fs.toFixed(1)}px ${MONO}`;
  const x = W * 0.022;
  c.fillStyle = '#9aa4b2'; c.fillText('@jovone.ascii', x, H * 0.622);
  const xs = [0, 0.24, 0.47, 0.70];
  stats.forEach(([label, val], i) => {
    const xx = x + W * xs[i], yy = H * 0.642;
    c.fillStyle = '#6b7685'; c.fillText(label, xx, yy);
    c.fillStyle = '#aeb7c4'; c.fillText(String(val), xx + c.measureText(label + '  ').width, yy);
  });
  c.fillStyle = '#6b7685'; c.fillText('letras', x, H * 0.657);
  c.fillStyle = '#aeb7c4'; c.fillText(letters.toLocaleString('pt-BR'), x + c.measureText('letras  ').width, H * 0.657);
  c.globalAlpha = 1;
}
function drawEditor(c, t, dim){
  const W = L.W, H = L.H, y0 = H * 0.675, eh = H - y0;
  const head = H * 0.026, lh = H * 0.0157, fs = lh * 0.66;
  c.globalAlpha = dim;
  c.fillStyle = '#0b1019'; c.fillRect(0, y0, W, eh);
  c.fillStyle = '#0f1622'; c.fillRect(0, y0, W, head);
  c.fillStyle = '#18202d'; c.fillRect(0, y0 + head, W, 1);
  c.textBaseline = 'middle'; c.font = `${fs.toFixed(1)}px ${MONO}`;
  c.fillStyle = '#c9d1d9'; c.textAlign = 'left'; c.fillText(SCENE.file, W * 0.022, y0 + head / 2);
  c.textAlign = 'right'; c.fillStyle = '#58a6ff'; c.fillText(paused ? 'paused · 30 fps' : 'running · 30 fps', W * 0.977, y0 + head / 2);
  c.textAlign = 'left';
  const st = editorState(t), bodyTop = y0 + head + lh * 0.4;
  c.save(); c.beginPath(); c.rect(0, y0 + head + 1, W, eh - head); c.clip();
  const first = Math.floor(st.top), frac = st.top - first, nVis = Math.ceil((eh - head) / lh) + 2;
  const gutter = W * 0.058, cw = c.measureText('M').width;
  for (let j = -1; j < nVis; j++){
    const li = first + j, y = bodyTop + (j - frac) * lh + lh / 2;
    if (li === st.cursor){ c.fillStyle = 'rgba(140,170,220,0.07)'; c.fillRect(0, y - lh / 2, W, lh); }
    if (li < 0 || li >= SRC.length) continue;
    c.textAlign = 'right'; c.fillStyle = li === st.cursor ? '#7d8796' : '#353e4c';
    c.fillText(String(li + 1), gutter - cw * 0.6, y); c.textAlign = 'left';
    let x = gutter + cw * 0.9;
    for (const [txt, col] of TOK[li]){ c.fillStyle = col; c.fillText(txt, x, y); x += cw * txt.length; if (x > W) break; }
  }
  const g1 = c.createLinearGradient(0, y0 + head, 0, y0 + head + lh * 1.6);
  g1.addColorStop(0, 'rgba(11,16,25,0.95)'); g1.addColorStop(1, 'rgba(11,16,25,0)');
  c.fillStyle = g1; c.fillRect(0, y0 + head, W, lh * 1.6);
  const g2 = c.createLinearGradient(0, H - lh * 2, 0, H);
  g2.addColorStop(0, 'rgba(11,16,25,0)'); g2.addColorStop(1, 'rgba(11,16,25,0.95)');
  c.fillStyle = g2; c.fillRect(0, H - lh * 2, W, lh * 2);
  c.restore(); c.globalAlpha = 1;
}

/* ---------- laço ---------- */
let t0 = performance.now(), last = 0, paused = false, pauseAt = 0;
const QS = new URLSearchParams(location.search);
if (QS.has('t')){ paused = true; pauseAt = parseFloat(QS.get('t')) || 0; }

function frame(now){
  requestAnimationFrame(frame);
  if (now - last < 1000 / FPS - 2) return;
  last = now;
  const T = paused ? pauseAt : (now - t0) / 1000;
  const t = T % SCENE.loop;
  gclear();
  const out = SCENE.frame(t, T);
  const dim = out.dim == null ? 1 : out.dim;

  const d = L.dpr, c = sctx;
  c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#000'; c.fillRect(0, 0, scn.width, scn.height);
  c.setTransform(d, 0, 0, d, 0, 0);
  if (out.bg){
    const gr = c.createLinearGradient(0, 0, 0, L.sceneH);
    for (const [k, rgb] of out.bg) gr.addColorStop(clamp(k, 0, 1), `rgb(${(rgb[0] * dim) | 0},${(rgb[1] * dim) | 0},${(rgb[2] * dim) | 0})`);
    c.fillStyle = gr; c.fillRect(0, 0, L.W, L.sceneH);
  }
  if (out.paint) out.paint(c, dim);
  c.font = `${L.fs.toFixed(2)}px ${MONO}`; c.textBaseline = 'middle'; c.textAlign = 'center';
  let letters = 0;
  for (let i = 0; i < G.n; i++){
    const ch = G.ch[i]; if (!ch || ch === ' ') continue;
    letters++;
    c.fillStyle = `rgba(${G.r[i]},${G.g[i]},${G.b[i]},${(G.a[i] * dim).toFixed(3)})`;
    c.fillText(ch, (i % G.cols + 0.5) * L.cw, (((i / G.cols) | 0) + 0.5) * L.ch);
  }
  gctx.setTransform(1, 0, 0, 1, 0, 0); gctx.clearRect(0, 0, glw.width, glw.height);
  gctx.drawImage(scn, 0, 0, glw.width, glw.height);

  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(d, 0, 0, d, L.ox * d, L.oy * d);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, L.W, L.H); ctx.clip();
  ctx.drawImage(scn, 0, L.top, L.W, L.sceneH);
  ctx.globalCompositeOperation = 'lighter'; ctx.imageSmoothingEnabled = true;
  const gl = out.glow == null ? 0.8 : out.glow;
  ctx.globalAlpha = 0.85 * gl; ctx.drawImage(glw, 0, L.top, L.W, L.sceneH);
  ctx.globalAlpha = 0.4 * gl; ctx.drawImage(glw, -L.cw, L.top - L.ch * 0.5, L.W + 2 * L.cw, L.sceneH + L.ch);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if (!WALL){
    drawTop(ctx, t);
    drawHUD(ctx, out.stats, letters, Math.max(0.35, dim));
    drawEditor(ctx, t, Math.max(0.35, dim));
  }
  ctx.restore();
}
cv.addEventListener('click', () => {
  const now = performance.now();
  if (!paused){ pauseAt = (now - t0) / 1000; paused = true; }
  else { t0 = now - pauseAt * 1000; paused = false; }
});
layout();
if (SCENE.init) SCENE.init();
requestAnimationFrame(frame);

</script>
</body>

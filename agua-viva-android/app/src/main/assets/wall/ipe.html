<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ipê — as quatro estações</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-tap-highlight-color:transparent}canvas{position:absolute;left:0;top:0;display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const WALLPAPER = true;
/* ============================================================
   ÁRVORE DAS ESTAÇÕES — um ipê que nasce, floresce, perde as
   folhas e dorme sob a neve (34 s em loop)
   ============================================================ */
const SCENE = {
  title: 'ipê · as quatro estações', file: 'ipe.py', loop: 34,

  init(){
    const R = rng(21), B = [];
    const W0 = 4.0;
    const grow = (parent, rel, len, depth, birth) => {
      const dur = 0.35 + len * 0.08, i = B.length;
      B.push({ parent, rel, len, depth, birth, dur, id: i, bend: (R() - 0.5) * 0.55, sway: R() * TAU,
               w0: W0 * Math.pow(0.56, depth), w1: W0 * Math.pow(0.56, depth + 1), tip: false });
      if (depth >= 6 || len < 1.0){ B[i].tip = true; return; }
      if (depth === 0){
        grow(i, -0.42 - 0.12 * R(), len * 0.78, 1, birth + dur * 0.9);
        grow(i, 0.38 + 0.12 * R(), len * 0.74, 1, birth + dur * 0.85);
        grow(i, (R() - 0.5) * 0.15, len * 0.55, 1, birth + dur * 0.95);
        return;
      }
      grow(i, (R() - 0.5) * 0.35, len * (0.70 + 0.12 * R()), depth + 1, birth + dur * (0.7 + 0.25 * R()));
      const side = R() < 0.5 ? 1 : -1;
      grow(i, side * (0.5 + 0.35 * R()), len * (0.55 + 0.15 * R()), depth + 1, birth + dur * (0.6 + 0.3 * R()));
      if (R() < 0.35) grow(i, -side * (0.45 + 0.3 * R()), len * (0.5 + 0.15 * R()), depth + 1, birth + dur * (0.75 + 0.2 * R()));
    };
    grow(-1, 0.03, 8.6, 0, 0.6);
    this.B = B;
    this.ex = new Float32Array(B.length); this.ey = new Float32Array(B.length); this.ang = new Float32Array(B.length);

    // raízes
    this.roots = [];
    for (let k = 0; k < 6; k++){
      const side = k % 2 ? 1 : -1;
      this.roots.push({ x: side * (0.8 + 0.7 * R()), a: side > 0 ? 0.10 + 0.30 * R() : Math.PI - 0.10 - 0.30 * R(), len: 3.0 + 3.5 * R(), w: 1.4 + 0.7 * R(), bend: (R() - 0.5) * 0.5, id: 900 + k });
    }

    // tufos de folhas nas pontas e nos galhos finos
    this.clusters = [];
    B.forEach(b => {
      if (!(b.tip || b.depth >= 4)) return;
      const n = b.tip ? 2 : 1;
      for (let k = 0; k < n; k++) this.clusters.push({ b: b.id, ox: (R() - 0.5) * 2.4, oy: (R() - 0.5) * 1.8 - 0.6, r: 1.5 + 1.1 * R(), z: R(), seed: R(), id: (R() * 1e9) | 0,
        appear: 5.6 + R() * 2.6, green: 12.2 + R() * 1.8, turn: 18.6 + R() * 3.0, gone: 21.5 + R() * 3.6,
        ink: [[hex('#7a2a0c'), hex('#ff9a2a')], [hex('#6a140c'), hex('#ff4a2a')], [hex('#7a5a0a'), hex('#ffd23a')], [hex('#5a2a10'), hex('#e0702a')]][(R() * 4) | 0] });
    });
    this.clusters.sort((a, b) => a.z - b.z);

    // folhas e pétalas soltas
    this.loose = [];
    this.clusters.forEach((c, i) => {
      if (R() < 0.75) this.loose.push({ c: i, kind: 'petal', t: 10.4 + R() * 3.2, ox: (R() - 0.5) * 3, oy: (R() - 0.5) * 2, seed: R(), v: 4.2 + 2.0 * R() });
      for (let k = 0; k < 2; k++) this.loose.push({ c: i, kind: 'leaf', t: c.turn + 0.8 + R() * (c.gone - c.turn), ox: (R() - 0.5) * 3, oy: (R() - 0.5) * 2, seed: R(), v: 4.5 + 2.5 * R() });
    });

    this.snow = Array.from({ length: 180 }, () => [R(), 2.5 + 3.5 * R(), R() * TAU, R()]);
    this.flakes = makeStars(120, 4);
    this.flies = Array.from({ length: 3 }, (_, i) => [R() * TAU, 0.6 + 0.5 * R(), i]);
    this.hills = R() * 100;

    // altura total (sem vento) para caber na tela
    this.pose(40, 0);
    let top = 0, half = 0;
    for (let i = 0; i < B.length; i++){ top = Math.min(top, this.ey[i]); half = Math.max(half, Math.abs(this.ex[i])); }
    this.extH = -top + 3.2; this.extW = half + 3.2;
  },

  windAt(t){ return 0.28 * Math.sin(t * 0.45) + 0.12 * Math.sin(t * 1.7 + 1) + 0.28 * sstep(18, 22, t) * (1 - sstep(25, 27, t)) + 0.08; },

  pose(t, wind){
    const B = this.B, ex = this.ex, ey = this.ey, ang = this.ang;
    for (let i = 0; i < B.length; i++){
      const b = B[i];
      const sx = b.parent < 0 ? 0 : ex[b.parent], sy = b.parent < 0 ? 0 : ey[b.parent];
      const a0 = b.parent < 0 ? -Math.PI / 2 : ang[b.parent];
      let a = a0 + b.rel + wind * 0.014 * Math.pow(b.depth + 1, 1.35) + 0.016 * b.depth * Math.sin(t * 2.1 + b.sway);
      a += (-Math.PI / 2 - a) * 0.07;
      const g = clamp((t - b.birth) / b.dur, 0, 1);
      ang[i] = a;
      // a ponta segue a curva do galho
      const L = b.len * g, ae = a + b.bend * 0.5;
      ex[i] = sx + Math.cos(a) * L * 0.5 + Math.cos(ae) * L * 0.5;
      ey[i] = sy + Math.sin(a) * L * 0.5 + Math.sin(ae) * L * 0.5;
    }
  },

  /* galho com volume: faixa curva que afina, casca com luz e sombra */
  band(sx, sy, a, len, w0, w1, bend, flare, id, prio, col, row, sc, winter, frost){
    const asp = L.asp;
    const n = Math.max(2, Math.ceil(len * sc * 1.4));
    const barkD = mix(hex('#2e1a0e'), hex('#3c4a60'), frost * 0.5), barkL = mix(hex('#b8875a'), hex('#e6eef8'), frost * 0.6);
    for (let i = 0; i <= n; i++){
      const s = i / n;
      const as = a + bend * (s - 0.5) * 0.5 + bend * 0.25;
      const along = len * s;
      const px = sx + Math.cos(a) * along * (1 - s * 0.5) + Math.cos(a + bend * 0.5) * along * s * 0.5;
      const py = sy + Math.sin(a) * along * (1 - s * 0.5) + Math.sin(a + bend * 0.5) * along * s * 0.5;
      const w = lerp(w0, w1, s) * (1 + flare * Math.pow(1 - s, 5));
      const nx = -Math.sin(as), ny = Math.cos(as);
      const halfCols = Math.abs(w * 0.5 * sc * asp * nx) + Math.abs(w * 0.5 * sc * ny);
      const tch = slopeChar(Math.cos(as) * L.cw * asp, Math.sin(as) * L.ch, '_');
      if (w * sc * asp < 1.3){ put(col(px), row(py), tch, mix(barkD, barkL, 0.75), 1, prio); continue; }
      const steps = Math.max(2, Math.ceil(halfCols * 2.2));
      for (let q = 0; q <= steps; q++){
        const u = q / steps * 2 - 1;                     // -1..1 através da largura
        const qx = px + nx * u * w * 0.5, qy = py + ny * u * w * 0.5;
        const c = col(qx), r = row(qy);
        const lit = clamp(0.55 - 0.6 * (nx * u) / (Math.abs(nx) + 0.3), 0, 1);   // esquerda iluminada
        let ch, rgb;
        if (Math.abs(u) > 0.78){ ch = tch; rgb = mix(barkD, barkL, lit * 0.8 + 0.1); }
        else {
          const v = noise2(s * len * 1.6 + id * 3.7, u * 2.2 + id);
          ch = "|!l1{}[]%#"[(v * 10) | 0];
          rgb = mix(barkD, barkL, clamp(lit * 0.85 + (v - 0.5) * 0.3, 0, 1));
        }
        put(c, r, ch, rgb, 1, prio);
      }
      if (winter > 0.3 && Math.abs(Math.cos(as)) > 0.35 && h1(id * 31 + i) < 0.7){
        const topU = ny < 0 ? 1 : -1;
        put(col(px + nx * topU * w * 0.5), row(py + ny * topU * w * 0.5) - 1, h1(id + i) < 0.5 ? '.' : '*', hex('#f4f8ff'), winter, prio + 1);
      }
    }
  },

  frame(t){
    const C = G.cols, R = G.rows, asp = L.asp, GR = R - 6;
    const sc = Math.min((GR - 4) / this.extH, (C * 0.49) / (this.extW * asp));
    const cx = C * 0.5;
    const col = X => cx + X * sc * asp, row = Y => GR + Y * sc;
    const wind = this.windAt(t);
    const spring = sstep(5.5, 8, t) * (1 - sstep(12.5, 14.5, t));
    const summer = sstep(12.5, 14.5, t) * (1 - sstep(19, 22, t));
    const autumn = sstep(18.5, 21, t) * (1 - sstep(25.5, 27, t));
    const winter = sstep(25.5, 27.5, t) * (1 - sstep(33.3, 34, t));
    const dayish = Math.max(spring, summer, autumn * 0.8);

    // céu e fundo
    stars(this.flakes, GR - 8, 0.35 + 0.5 * winter + 0.2 * (1 - dayish), t, 0);
    if (dayish > 0.05){
      const sx = C * 0.82, sy = R * 0.12, sunC = mix(hex('#fff2b0'), hex('#ffb04a'), autumn);
      disc(sx, sy, 3.0, (c, r, d) => put(c, r, letter(clamp(1.05 - d * 0.7, 0, .99), c * 31 + r), mix(sunC, hex('#ff8a3a'), d * 0.5), dayish, 2));
      for (let k = 0; k < 9; k++){                           // raios de sol
        const a = Math.PI * (0.55 + k * 0.06) + Math.sin(t * 0.3 + k) * 0.02, len = R * (0.45 + 0.2 * h1(k));
        for (let s = 5; s < len; s += 1.0){
          const c = sx + Math.cos(a) * s * asp, r = sy + Math.sin(a) * s;
          if (h3(c, r, k) < 0.32) put(c, r, '.', sunC, dayish * 0.22 * (1 - s / len), 1);
        }
      }
    }
    if (winter > 0.02) disc(C * 0.82, R * 0.12, 2.6, (c, r, d, dx, dy) => {
      const cr = noise2(dx * 3 + 5, dy * 3) > 0.62 ? 0.55 : 1;
      put(c, r, letter(clamp((1 - d * 0.5) * cr, 0, .99), c * 17 + r), mul(hex('#e4ecff'), cr), winter, 2);
    });
    // morros ao longe
    const hillC = keyColor([[0, hex('#16301e')], [8, hex('#2a5a34')], [14, hex('#24502c')], [20, hex('#5a4220')], [26, hex('#3a3020')], [28, hex('#a8b8d0')], [34, hex('#a8b8d0')]], t);
    for (let c = 0; c < C; c++){
      const top = GR - 2 - 4 * fbm1(c * 0.05 + this.hills);
      for (let r = Math.round(top); r < GR; r++) if (h2(c, r) < 0.55) put(c, r, r === Math.round(top) ? '_' : (h2(c, r) < 0.25 ? ':' : '.'), mul(hillC, 0.55), 0.6, 1);
    }

    // chão
    const grassC = keyColor([[0, hex('#3a6a2e')], [7, hex('#5fd068')], [13, hex('#3fae4f')], [20, hex('#c08a2a')], [26, hex('#7a5a30')], [28, hex('#e8f0ff')], [34, hex('#e8f0ff')]], t);
    for (let c = 0; c < C; c++){
      const hh = h1(c * 7 + 3), sway = Math.sin(t * 2.4 + c * 0.3) * 0.6 + wind * 1.3;
      put(c, GR, ",.'\"`;:"[(hh * 7) | 0], grassC, 0.95, 5);
      if (hh < 0.45 && winter < 0.5) put(c, GR - 1, sway > 0.45 ? '/' : (sway < -0.25 ? '\\' : '|'), mul(grassC, 0.85 + 0.3 * hh), 0.85, 5);
      if (hh > 0.93 && (spring + summer) > 0.3) put(c, GR - 1, h1(c) < 0.5 ? '*' : 'o', h1(c * 3) < 0.5 ? hex('#ffd23a') : hex('#ff8fd0'), spring + summer, 6);
      for (let r = GR + 1; r < R; r++){ const v = h2(c, r); if (v < 0.5) put(c, r, v < 0.14 ? ':' : '.', mix(hex('#5a3a22'), hex('#cfd8e8'), winter * 0.8), 0.3 + 0.3 * (r - GR) / 6, 0); }
    }
    if (t < 1.2) put(cx, GR - 0.4, 'o', hex('#d8b48a'), sstep(0, 0.4, t), 50);

    // tronco, galhos e raízes
    this.pose(t, wind);
    const B = this.B, ex = this.ex, ey = this.ey, ang = this.ang;
    const frost = winter;
    let nb = 0;
    const rootG = sstep(0.8, 3.5, t);
    if (rootG > 0) for (const rt of this.roots) this.band(rt.x, 0.15, rt.a, rt.len * rootG, rt.w, 0.15, rt.bend, 0, rt.id, 36, col, row, sc, 0, frost * 0.5);
    for (let i = 0; i < B.length; i++){
      const b = B[i];
      const g = clamp((t - b.birth) / b.dur, 0, 1);
      if (g <= 0) continue;
      nb++;
      const sx = b.parent < 0 ? 0 : ex[b.parent], sy = b.parent < 0 ? 0 : ey[b.parent];
      const gw = 0.35 + 0.65 * sstep(0, 1, (t - b.birth) / (b.dur * 3));
      this.band(sx, sy, ang[i], b.len * g, b.w0 * gw, b.w1 * gw, b.bend, b.depth === 0 ? 1.1 : 0, b.id, b.depth <= 2 ? 40 : 34, col, row, sc, winter, frost);
    }

    // copa: tufos com volume e luz
    const PINK_D = hex('#a02866'), PINK_L = hex('#ffb8e4'), GREEN_D = hex('#0e4a22'), GREEN_L = hex('#9ef07a');
    let leafCells = 0, tufts = 0;
    for (const cl of this.clusters){
      const b = B[cl.b];
      if (clamp((t - b.birth) / b.dur, 0, 1) < 1 || t < cl.appear || t > cl.gone + 1.2) continue;
      const growR = sstep(cl.appear, cl.appear + 1.8, t);
      const keep = 1 - sstep(cl.turn + 0.8, cl.gone + 1.2, t);
      const rad = cl.r * Math.sqrt(growR) * (0.75 + 0.25 * keep);
      if (rad < 0.25) continue;
      const sw = 0.3 * Math.sin(t * 2.2 + cl.seed * 9) * (0.4 + wind);
      const X = ex[cl.b] + cl.ox + sw, Y = ey[cl.b] + cl.oy;
      const c0 = col(X), r0 = row(Y), rr = rad * sc, rc = rr * asp;
      const toGreen = sstep(cl.green, cl.green + 1.6, t), toAut = sstep(cl.turn, cl.turn + 1.6, t);
      let dark = mix(mix(PINK_D, GREEN_D, toGreen), cl.ink[0], toAut);
      let light = mix(mix(PINK_L, GREEN_L, toGreen), cl.ink[1], toAut);
      tufts++;
      const prio = 30 + Math.round(cl.z * 20);
      const shade = 0.72 + 0.28 * cl.z;
      for (let r = Math.floor(r0 - rr - 1); r <= r0 + rr + 1; r++){
        for (let c = Math.floor(c0 - rc - 1); c <= c0 + rc + 1; c++){
          const dx = (c - c0) / rc, dy = (r - r0) / rr, d = Math.hypot(dx, dy);
          const edge = 1 + 0.42 * (noise2(c * 0.55 + cl.seed * 40, r * 0.7 + cl.seed * 17) - 0.5);
          if (d > edge) continue;
          const cid = (c * 7919 + r * 104729) ^ cl.id;
          if (hash(cid) > 0.35 + 0.65 * keep) continue;
          const nz = Math.sqrt(Math.max(0, 1 - Math.min(d / edge, 1) ** 2));
          const lam = clamp(-0.5 * dx - 0.62 * dy + 0.62 * nz, 0, 1);
          const b2 = clamp((0.18 + 0.82 * lam) * shade, 0, 0.99);
          let ch = "..,::;*oo%&8@@#"[(b2 * 14.99) | 0];
          if (toGreen < 0.5 && hash(cid + 1) < 0.08) ch = '*';
          put(c, r, ch, mix(dark, light, b2), 0.55 + 0.45 * growR, prio);
          leafCells++;
        }
      }
    }

    // pétalas e folhas caindo, tapete no chão
    let falling = 0;
    for (const f of this.loose){
      if (t < f.t) continue;
      const cl = this.clusters[f.c], b = B[cl.b];
      const X0 = ex[cl.b] + cl.ox + f.ox, Y0 = ey[cl.b] + cl.oy + f.oy;
      const s = t - f.t, land = -Y0 / f.v, wf = this.windAt(f.t);
      const fx = u => X0 + 1.8 * Math.sin(u * 3.0 + f.seed * 6) + (wf + 0.25) * u * 3.0;
      const rgb = f.kind === 'petal' ? mix(hex('#ff8fd0'), hex('#ffe4f4'), f.seed) : cl.ink[1];
      if (s < land){
        put(col(fx(s)), row(Y0 + f.v * s), f.kind === 'petal' ? "*'`."[((s * 9 + f.seed * 4) | 0) % 4] : "~,`*'"[((s * 8 + f.seed * 5) | 0) % 5], rgb, 1, 55);
        falling++;
      } else {
        const life = f.kind === 'petal' ? 1 - sstep(16, 19, t) : 1 - sstep(28, 30.5, t);
        put(col(fx(land)), GR - (h1(f.seed * 1e4) < 0.4 ? 1 : 0), f.kind === 'petal' ? '*' : "~,.%"[(f.seed * 4) | 0], mul(rgb, 0.85), life, 7);
      }
    }

    // borboletas na primavera e no verão, passarinhos no verão
    const fly = Math.max(spring, summer * 0.6);
    if (fly > 0.05) for (const b of this.flies){
      const x = cx + Math.sin(t * 0.5 * b[1] + b[0]) * C * 0.38, y = GR - 6 - 5 * Math.abs(Math.sin(t * 0.7 + b[0] * 2)) - b[2] * 2;
      text(x, y, ((t * 9 + b[2]) | 0) % 2 ? '}{' : '><', b[2] === 1 ? hex('#8be0ff') : hex('#ffd23a'), fly, 60);
    }
    if (summer > 0.05) for (let i = 0; i < 4; i++){
      const x = ((t - 12.5) * 7 + i * 9) % (C + 24) - 12, y = R * 0.18 + i * 1.6 + Math.sin(t * 2 + i) * 0.8;
      text(x, y, ((t * 7 + i * 1.3) | 0) % 2 ? '\\v/' : '-v-', [210, 220, 240], summer * 0.9, 60);
    }

    // neve
    if (winter > 0.02) for (const s of this.snow){
      const y = ((s[3] * R + (t - 25) * s[1]) % R + R) % R;
      put(s[0] * C + Math.sin(t * 0.9 + s[2]) * 2 + y * 0.15 * wind, y, s[3] < 0.3 ? '*' : '.', hex('#f4f8ff'), winter * (0.6 + 0.4 * s[3]), 70);
    }

    const skyT = keyColor([[0, hex('#03070f')], [7, hex('#081a2c')], [14, hex('#0a2238')], [20, hex('#1a1008')], [25, hex('#120a06')], [27.5, hex('#060a18')], [34, hex('#060a18')]], t);
    const skyH = keyColor([[0, hex('#0a1420')], [7, hex('#2a2440')], [14, hex('#1e4660')], [20, hex('#40240e')], [25, hex('#24140a')], [27.5, hex('#16203a')], [34, hex('#16203a')]], t);
    const gy = GR / R;
    const season = t < 5.5 ? 'brotando' : t < 13 ? 'primavera' : t < 19.5 ? 'verão' : t < 26 ? 'outono' : 'inverno';
    return { stats: [['estação', season], ['galhos', nb], ['tufos', tufts], ['caindo', falling]],
             dim: sstep(0, 0.6, t) * (1 - sstep(33.3, 34, t)), glow: 0.7,
             bg: [[0, mul(skyT, 0.7)], [gy, mul(skyH, 0.55)], [gy + 0.002, mul(skyH, 0.18)], [1, [0, 0, 0]]] };
  },
};

const CODE = String.raw`import numpy as np

# an ipe tree: it grows from a seed, blooms pink, turns green, rusts, and sleeps under snow

TRUNK_LEN, TRUNK_W, TAPER = 8.6, 4.0, 0.56               # each fork is 56% as thick
MAX_DEPTH = 6
BARK = "|!l1{}[]%#"                                      # bark texture, faint -> dense
FOLIAGE = "..,::;*oo%&8@@#"                              # leaves, shadow -> sunlit


class Branch:
    def __init__(self, parent, rel, length, depth, birth, rng):
        self.parent, self.rel, self.length, self.depth = parent, rel, length, depth
        self.birth, self.dur = birth, 0.35 + 0.08 * length
        self.bend = rng.uniform(-0.27, 0.27)              # no branch is perfectly straight
        self.w0 = TRUNK_W * TAPER ** depth
        self.w1 = TRUNK_W * TAPER ** (depth + 1)


def grow(rng, parent=None, rel=0.03, length=TRUNK_LEN, depth=0, birth=0.6):
    me = Branch(parent, rel, length, depth, birth, rng)
    yield me
    if depth >= MAX_DEPTH or length < 1.0:
        return
    if depth == 0:                                       # the trunk opens into three limbs
        for rel, k in ((-0.48, 0.78), (0.44, 0.74), (0.0, 0.55)):
            yield from grow(rng, me, rel, length * k, 1, birth + 0.9 * me.dur)
        return
    yield from grow(rng, me, rng.normal(0, 0.12), length * rng.uniform(0.70, 0.82), depth + 1,
                    birth + me.dur * rng.uniform(0.7, 0.95))           # the leader goes on
    side = rng.choice([-1, 1])
    yield from grow(rng, me, side * rng.uniform(0.5, 0.85), length * rng.uniform(0.55, 0.7),
                    depth + 1, birth + me.dur * rng.uniform(0.6, 0.9))


def pose(tree, t, wind):
    # from the trunk up: each branch leans with the wind a bit more than its parent,
    # and all of them slowly turn towards the light
    for b in tree:
        a = b.parent.angle + b.rel + 0.014 * wind * (b.depth + 1) ** 1.35
        a += 0.016 * b.depth * np.sin(2.1 * t + b.sway)
        b.angle = a + (-np.pi / 2 - a) * 0.07
        g = np.clip((t - b.birth) / b.dur, 0, 1)
        b.tip = b.parent.tip + g * b.length * mean_dir(b.angle, b.angle + 0.5 * b.bend)


def band(grid, b, sc):
    # a branch is a curved ribbon that tapers; bark is lit from the left
    for s in np.linspace(0, 1, int(1.4 * b.length * sc) + 1):
        p, along = curve(b, s)
        w = np.interp(s, [0, 1], [b.w0, b.w1]) * (1 + flare(b) * (1 - s) ** 5)
        for u in np.linspace(-1, 1, max(2, int(w * sc * 2.2))):
            q = p + normal(along) * u * w / 2
            lit = 0.55 - 0.5 * u * np.sign(normal(along)[0])
            ch = slope_char(along) if abs(u) > 0.78 else BARK[int(10 * noise(s, u))]
            grid.put(q, ch, mix(BARK_DARK, BARK_LIGHT, lit))


def tuft(grid, cluster, t):
    # leaves come in round tufts, shaded like little spheres; autumn thins them out
    r = cluster.radius * np.sqrt(smooth((t - cluster.appear) / 1.8))
    keep = 1 - smooth((t - cluster.turn - 0.8) / (cluster.gone - cluster.turn + 0.4))
    for cell, (dx, dy) in grid.disc(cluster.centre, r, ragged=0.42):
        if hash(cell) > 0.35 + 0.65 * keep:
            continue
        nz = np.sqrt(max(0, 1 - dx * dx - dy * dy))
        light = np.clip(-0.5 * dx - 0.62 * dy + 0.62 * nz, 0, 1)
        grid.put(cell, FOLIAGE[int(14.99 * light)], season_colour(cluster, t, light), z=cluster.z)


def season_colour(c, t, light):
    pink = mix(IPE_DARK, IPE_LIGHT, light)               # the ipe flowers before the leaves
    green = mix(LEAF_DARK, LEAF_LIGHT, light)
    rust = mix(*c.autumn, light)
    return mix(mix(pink, green, smooth((t - c.green) / 1.6)), rust, smooth((t - c.turn) / 1.6))


def drift(item, t):
    # petals (spring) and leaves (autumn) spiral down with the wind they were given
    s = t - item.t
    land = -item.y0 / item.speed
    s = min(s, land)
    x = item.x0 + 1.8 * np.sin(3 * s + 6 * item.seed) + 3 * (wind(item.t) + 0.25) * s
    return x, item.y0 + item.speed * s, s >= land


def frame(t):
    grid = Grid(COLS, ROWS)
    grid.sky(t, sun=summer(t), moon=winter(t), rays=9)
    grid.hills(colour=HILLS(t))
    grid.ground(colour=GRASS(t), flowers=spring(t))
    pose(TREE, t, wind(t))
    for root in ROOTS:
        band(grid, root, SCALE)
    for b in TREE:
        band(grid, b, SCALE)
    for c in sorted(TUFTS, key=lambda c: c.z):
        tuft(grid, c, t)
    for item in PETALS + LEAVES:
        grid.put(*drift(item, t))
    grid.butterflies(t)
    grid.snow(FLAKES, t)
    return grid.render(glow=0.7)


if __name__ == "__main__":
    run(frame, fps=30, seconds=34)

let L = {}, G = null;
function gridInit(cols, rows){

function idx(c, r){ c = Math.round(c); r = Math.round(r); return (c < 0 || r < 0 || c >= G.cols || r >= G.rows) ? -1 : r * G.cols + c; }
function put(c, r, chr, rgb, a = 1, p = 0){

function addc(c, r, chr, rgb, a = 1, p = 0){
  const i = idx(c, r); if (i < 0 || a <= 0.01) return;

  if (p < G.p[i]) return;
  const oa = G.a[i], wo = oa / (oa + a), wn = a / (oa + a);

function line(c0, r0, c1, r1, rgb, a = 1, p = 0, flat, fn = put){
  const dc = c1 - c0, dr = r1 - r0;

  for (let i = 0; i <= n; i++){ const k = i / n; fn(c0 + dc * k, r0 + dr * k, chr, rgb, a, p); }

function text(c, r, s, rgb, a = 1, p = 0){ for (let i = 0; i < s.length; i++) if (s[i] !== ' ') put(c + i, r, s[i], rgb, a, p); }
function disc(cc, rr, rad, fn){
  const asp = L.ch / L.cw;
  for (let r = Math.floor(rr - rad - 1); r <= rr + rad + 1; r++)
    for (let c = Math.floor(cc - rad * asp - 1); c <= cc + rad * asp + 1; c++){
      const dx = (c - cc) / asp, dy = r - rr, d = Math.hypot(dx, dy) / rad;

function makeStars(n, seed){ const R = rng(seed); return Array.from({ length: n }, () => [R(), R(), R(), R(), mix([200, 215, 255], [255, 236, 210], R())]); }

  for (const s of list){
    const tw = 0.4 + 0.6 * Math.max(0, Math.sin(t * (1 + s[3]) + s[2] * 9));
    put(s[0] * G.cols, s[1] * rowsMax, s[3] > 0.88 ? '+' : (tw > 0.85 ? '+' : '.'), s[4], alpha * tw, p); n++;

/* ---------- editor ---------- */
const KW = new Set(['def', 'return', 'for', 'in', 'if', 'not', 'continue', 'and', 'or', 'import', 'as', 'from', 'while', 'else', 'elif', 'lambda', 'None', 'True', 'False', 'is', 'yield', 'with', 'class']);
const COLK = { kw: '#ff7b72', fn: '#79c0ff', num: '#f2a65e', com: '#5d6877', str: '#a5d6ff', txt: '#d3dae3' };
function tokenize(s){

  while ((m = re.exec(s))){
    if (m[1]) out.push([m[1], COLK.com]);
    else if (m[2]) out.push([m[2], COLK.str]);
    else if (m[3]) out.push([m[3], COLK.num]);
    else if (m[4]){
      const w = m[4], next = /^\s*\(/.test(s.slice(re.lastIndex));

      else if (KW.has(w)) out.push([w, COLK.kw]);

const SRC = CODE.split('\n'), TOK = SRC.map(tokenize);
const MARKS = (() => { const m = []; SRC.forEach((l, i) => { if (/^def |^class |^[A-Z_]+ = |^[A-Z_]+, /.test(l) && (m.length === 0 || i - m[m.length - 1] > 4)) m.push(i); }); return m; })();
function editorState(t){
  const n = MARKS.length, seg = SCENE.loop / n;
  const i = Math.min(n - 1, Math.floor(t / seg)), k = (t - i * seg) / seg;
  const l0 = MARKS[i], l1 = i + 1 < n ? MARKS[i + 1] : SRC.length - 1;

/* ---------- laço ---------- */
let t0 = performance.now(), last = 0, paused = false, pauseAt = 0;
const QS = new URLSearchParams(location.search);
if (QS.has('t')){ paused = true; pauseAt = parseFloat(QS.get('t')) || 0; }

function frame(now){
  requestAnimationFrame(frame);
  if (now - last < 1000 / FPS - 2) return;
  last = now;
  const T = paused ? pauseAt : (now - t0) / 1000;
  const t = T % SCENE.loop;

  let letters = 0;

cv.addEventListener('click', () => {
  const now = performance.now();

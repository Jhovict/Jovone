<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jovone Games</title>
<meta name="theme-color" content="#0d1420">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
:root{--night:#0d1420;--panel:#1b2230;--panel-2:#2a3346;--stripe:#f2b632;--ink:#eef2f8;--mute:#93a0b5;
--display:'Bungee','Impact',sans-serif;--body:'Chakra Petch','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 600px at 70% -10%,#1d2a44 0%,transparent 60%),var(--night);color:var(--ink);font-family:var(--body);padding:0 16px 48px}
.wrap{max-width:1080px;margin:0 auto}
header{padding:40px 0 24px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,7vw,3.4rem);line-height:1;margin:0}
h1 span{color:var(--stripe)}
header p{color:var(--mute);margin:10px 0 0;font-size:1.02rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{position:relative;display:flex;flex-direction:column;background:var(--panel);border-radius:18px;overflow:hidden;color:inherit;text-decoration:none;border:2px solid transparent;transition:transform .18s,border-color .18s,box-shadow .18s}
a.card:hover,a.card:focus-visible{transform:translateY(-4px);border-color:var(--stripe);box-shadow:0 14px 34px rgba(0,0,0,.45);outline:none}
.cover{aspect-ratio:16/9;background:var(--panel-2);position:relative;overflow:hidden}
.cover svg{width:100%;height:100%;display:block}
.tag{position:absolute;top:10px;left:10px;background:rgba(13,20,32,.85);padding:4px 10px;border-radius:999px;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h2{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0}
.body p{margin:0;color:var(--mute);font-size:.92rem;line-height:1.4}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.chip{background:var(--panel-2);border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:600}
.play{margin-top:6px;align-self:flex-start;background:var(--stripe);color:var(--night);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.85rem;padding:9px 18px;border-radius:999px}
.soon{opacity:.62;border:2px dashed var(--panel-2);background:transparent}
.soon .cover{display:grid;place-items:center;background:repeating-linear-gradient(45deg,#161d2b 0 14px,#1b2230 14px 28px)}
.soon .plus{font-family:var(--display);font-size:3.4rem;color:var(--panel-2)}
footer{margin-top:40px;color:var(--mute);font-size:.8rem}
@media (max-width:560px){header{padding-top:28px}.grid{gap:16px}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>JOVONE <span>GAMES</span></h1>
    <p>Escolha um jogo para começar.</p>
  </header>
  <main class="grid" id="grid" aria-label="Lista de jogos"></main>
  <footer>Mais jogos a caminho.</footer>
</div>
<script>
/* ===== LISTA DE JOGOS =====
   Para adicionar um jogo: crie uma pasta com um index.html e inclua um item aqui.
   id: nome da pasta | cover: SVG (string) ou URL de imagem | stats: função opcional que devolve textos curtos */
const GAMES = [
  {
    id: 'turbo-br316',
    title: 'Turbo BR-316',
    tag: 'Corrida 3D',
    desc: 'Corrida pelas estradas brasileiras: seis carros, seis mapas (inclusive ruas do centro com pedestres), clima, contrarrelógio com fantasma e moedas para desbloquear novos carros.',
    cover: `<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a4d"/><stop offset=".6" stop-color="#f2b632"/><stop offset="1" stop-color="#ffe3a0"/></linearGradient></defs>
      <rect width="320" height="180" fill="url(#sk)"/>
      <circle cx="220" cy="78" r="30" fill="#fff3c8" opacity=".9"/>
      <path d="M0 96 L70 62 L120 88 L190 52 L260 90 L320 66 L320 110 L0 110Z" fill="#7a4a3a"/>
      <path d="M0 110H320V180H0Z" fill="#2a3346"/>
      <path d="M130 110H190L270 180H50Z" fill="#1b2230"/>
      <path d="M160 112V180" stroke="#f2b632" stroke-width="4" stroke-dasharray="10 12"/>
      <path d="M135 110L55 180M185 110L265 180" stroke="#eef2f8" stroke-width="2" opacity=".6"/>
      <g transform="translate(160 150)"><rect x="-34" y="-16" width="68" height="22" rx="8" fill="#d6392b"/><path d="M-22 -16L-14 -30H14L22 -16Z" fill="#a82a20"/><rect x="-12" y="-27" width="24" height="10" rx="3" fill="#9fd4ff" opacity=".85"/><rect x="-30" y="-6" width="12" height="5" rx="2" fill="#ffefb0"/><rect x="18" y="-6" width="12" height="5" rx="2" fill="#ffefb0"/><rect x="-38" y="2" width="14" height="10" rx="3" fill="#0d1420"/><rect x="24" y="2" width="14" height="10" rx="3" fill="#0d1420"/></g>
    </svg>`,
    stats: () => {
      const out = [];
      try {
        const c = localStorage.getItem('br316coins');
        if (c !== null) out.push('🪙 ' + c + ' moedas');
        const own = JSON.parse(localStorage.getItem('br316own') || 'null');
        if (Array.isArray(own)) out.push('🚗 ' + own.length + ' carros');
      } catch (e) {}
      return out;
    }
  }
  /* , { id:'meu-fps', title:'...', tag:'FPS', desc:'...', cover:'...' } */
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const grid = document.getElementById('grid');

GAMES.forEach(g => {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = g.id + '/';
  const cover = /^\s*</.test(g.cover || '') ? g.cover : (g.cover ? `<img src="${esc(g.cover)}" alt="" style="width:100%;height:100%;object-fit:cover">` : '');
  let chips = [];
  try { chips = g.stats ? g.stats() : []; } catch (e) {}
  a.innerHTML = `<div class="cover">${cover}<span class="tag">${esc(g.tag || 'Jogo')}</span></div>
    <div class="body"><h2>${esc(g.title)}</h2><p>${esc(g.desc || '')}</p>
    <div class="stats">${chips.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>
    <span class="play">Jogar ▸</span></div>`;
  grid.appendChild(a);
});

const soon = document.createElement('div');
soon.className = 'card soon';
soon.innerHTML = `<div class="cover"><span class="plus">+</span><span class="tag">Em breve</span></div>
  <div class="body"><h2>Novo jogo</h2><p>Aventura, FPS e outros estilos virão aqui.</p></div>`;
grid.appendChild(soon);
</script>
</body>
</html>

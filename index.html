<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jovone Games</title>
<meta name="theme-color" content="#05070d">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;500;600;700&display=swap">
<style>
/* Tela de console: fundo com a capa do jogo em foco, fileira horizontal de capas, informações e botão Jogar */
:root{--bg:#05070d;--ink:#eef2f8;--mute:#93a0b5;--line:rgba(255,255,255,.16);--glass:rgba(12,16,28,.62);--stripe:#f2b632;
--display:'Bungee','Impact',sans-serif;--body:'Chakra Petch','Segoe UI',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow-x:hidden}
.hero{position:fixed;inset:0;z-index:0;overflow:hidden}
.hero .layer{position:absolute;inset:-4%;opacity:0;transition:opacity .6s,transform 8s ease-out;transform:scale(1.04)}
.hero .layer.on{opacity:1;transform:scale(1.1)}
.hero svg,.hero img{width:100%;height:100%;display:block;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,7,13,.94) 0%,rgba(5,7,13,.6) 45%,rgba(5,7,13,.2) 100%),linear-gradient(0deg,var(--bg) 0%,transparent 50%)}
.app{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:18px;
padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;gap:14px}
.brand{font-family:var(--display);font-size:1.15rem;letter-spacing:.02em}
.brand span{color:var(--stripe)}
.spacer{flex:1}
.clock{font-variant-numeric:tabular-nums;font-size:1rem}
.pad{font-size:.75rem;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.pad[hidden]{display:none}
.row-wrap{overflow-x:auto;scrollbar-width:none;margin-inline:-6px;padding:14px 6px 8px}
.row-wrap::-webkit-scrollbar{display:none}
.row{display:flex;gap:14px;align-items:flex-start;width:max-content;padding-right:40vw}
.tile{flex:none;width:100px;height:100px;border-radius:14px;overflow:hidden;cursor:pointer;border:0;padding:0;background:#111;position:relative;
transition:width .25s,height .25s,box-shadow .25s;outline:none;color:inherit}
.tile svg,.tile img{width:100%;height:100%;display:block;object-fit:cover}
.tile.on{width:156px;height:156px;box-shadow:0 0 0 3px var(--ink),0 18px 40px rgba(0,0,0,.6)}
.tile:focus-visible{box-shadow:0 0 0 3px var(--stripe)}
.tile.soon{background:var(--glass);border:1.5px dashed var(--line);display:grid;place-items:center;font-family:var(--display);font-size:2.4rem;color:var(--mute)}
.info{margin-top:auto;max-width:600px;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--stripe);font-weight:700}
.info h1{font-family:var(--display);font-weight:400;font-size:clamp(2.4rem,7vw,4.6rem);line-height:.95;margin:0;text-wrap:balance}
.info p{margin:0;color:#cfd6e3;line-height:1.5;font-size:1rem;max-width:60ch}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:.8rem;font-weight:600}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.btn{border:0;border-radius:999px;padding:13px 34px;font:700 1rem var(--body);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;background:var(--ink);color:#05070d;text-decoration:none;display:inline-block}
.btn:hover,.btn:focus-visible{background:var(--stripe);outline:none}
.btn[aria-disabled=true]{opacity:.45;pointer-events:none}
.dock{display:flex;gap:18px;font-size:.78rem;color:var(--mute);flex-wrap:wrap}
.key{display:inline-grid;place-items:center;min-width:22px;height:22px;border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-right:6px;color:var(--ink)}
.launch{position:fixed;inset:0;z-index:5;background:var(--bg);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .35s}
.launch.show{opacity:1;pointer-events:auto}
.ring{width:54px;height:54px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--stripe);animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:560px){.tile{width:78px;height:78px}.tile.on{width:120px;height:120px}.dock{display:none}.info{margin-top:8px}.info h1{font-size:2.2rem}.info p{font-size:.92rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="hero" id="hero"></div>
<div class="app">
  <header class="top">
    <div class="brand">JOVONE <span>GAMES</span></div>
    <div class="spacer"></div>
    <span class="pad" id="pad" hidden>🎮 Controle conectado</span>
    <span class="clock" id="clock">--:--</span>
  </header>
  <div class="row-wrap"><div class="row" id="row" role="listbox" aria-label="Jogos"></div></div>
  <section class="info" id="info" aria-live="polite"></section>
  <footer class="dock">
    <span><span class="key">←</span><span class="key">→</span>Navegar</span>
    <span><span class="key">Enter</span>Jogar</span>
    <span><span class="key">A</span>Jogar no controle</span>
  </footer>
</div>
<div class="launch" id="launch"><div style="text-align:center"><div class="ring"></div><div id="launchTxt"></div></div></div>
<script>
/* ===== LISTA DE JOGOS =====
   Para adicionar um jogo: crie uma pasta com um index.html e inclua um item aqui.
   id: nome da pasta | cover: SVG (string) ou URL de imagem | stats: função opcional que devolve textos curtos */
const GAMES = [
  {
    id: 'turbo-br316',
    title: 'Turbo BR-316',
    tag: 'Corrida 3D',
    desc: 'Corrida pelas estradas brasileiras: seis carros, seis mapas (inclusive ruas do centro com pedestres), clima, contrarrelógio com fantasma e moedas para desbloquear novos carros.',
    cover: `<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a4d"/><stop offset=".6" stop-color="#f2b632"/><stop offset="1" stop-color="#ffe3a0"/></linearGradient></defs>
      <rect width="320" height="180" fill="url(#sk)"/>

      <path d="M0 96 L70 62 L120 88 L190 52 L260 90 L320 66 L320 110 L0 110Z" fill="#7a4a3a"/>

      <path d="M130 110H190L270 180H50Z" fill="#1b2230"/>

      <path d="M135 110L55 180M185 110L265 180" stroke="#eef2f8" stroke-width="2" opacity=".6"/>
      <g transform="translate(160 150)"><rect x="-34" y="-16" width="68" height="22" rx="8" fill="#d6392b"/><path d="M-22 -16L-14 -30H14L22 -16Z" fill="#a82a20"/><rect x="-12" y="-27" width="24" height="10" rx="3" fill="#9fd4ff" opacity=".85"/><rect x="-30" y="-6" width="12" height="5" rx="2" fill="#ffefb0"/><rect x="18" y="-6" width="12" height="5" rx="2" fill="#ffefb0"/><rect x="-38" y="2" width="14" height="10" rx="3" fill="#0d1420"/><rect x="24" y="2" width="14" height="10" rx="3" fill="#0d1420"/></g>
    </svg>`,
    stats: () => {
      const out = [];
      try {
        const c = localStorage.getItem('br316coins');
        if (c !== null) out.push('🪙 ' + c + ' moedas');
        const own = JSON.parse(localStorage.getItem('br316own') || 'null');
        if (Array.isArray(own)) out.push('🚗 ' + own.length + ' carros');

  },
  {
    id: 'pane-seca',

      return out;
    }

  {
    id: 'pulse-kart',
    title: 'Pulse Kart',
    tag: 'Kart 3D',
    desc: 'Kart 125cc no circuito Apex Loop: largada com as cinco luzes, drift com turbo, vácuo nas retas e corrida contra 7 pilotos — ou contra o relógio com o kart fantasma.',

      <g transform="translate(196 132)">
        <ellipse cx="0" cy="18" rx="62" ry="8" fill="#000" opacity=".25"/>

        <path d="M-4 -49 L-2 -36 M4 -49 L2 -36" stroke="#f26a1b" stroke-width="3"/>

      <g transform="translate(118 112) scale(.5)"><rect x="-60" y="2" width="22" height="18" rx="5" fill="#15161a"/><rect x="38" y="2" width="22" height="18" rx="5" fill="#15161a"/><path d="M-50 4 L-30 -6 L30 -6 L50 4 L44 10 L-44 10Z" fill="#1f6fd6"/><circle cx="0" cy="-30" r="13" fill="#1f6fd6"/><path d="M-12 -32 A13 13 0 0 1 12 -32 L12 -28 L-12 -28Z" fill="#101318"/></g>
    </svg>`,
    stats: () => {
      const out = [];
      try {
        const best = JSON.parse(localStorage.getItem('pkartBest') || 'null');
        if (best) { const m = Math.floor(best / 60), s2 = best - m * 60; out.push('⏱ ' + m + ':' + (s2 < 10 ? '0' : '') + s2.toFixed(2) + ' melhor volta'); }
        const st = JSON.parse(localStorage.getItem('pkartStats') || 'null');
        if (st && st.wins) out.push('🏆 ' + st.wins + (st.wins === 1 ? ' vitória' : ' vitórias'));

    }
  },

        if (s && s.m) { out.push('🏆 ' + s.w + (s.w === 1 ? ' vitória' : ' vitórias')); out.push('🎯 ' + s.k + ' abates'); }
      } catch (e) {}
      return out;
    }
  }
  /* , { id:'meu-fps, title:'...', tag:'FPS', desc:'...', cover:'...' } */
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const coverHTML = g => /^\s*</.test(g.cover || '') ? g.cover : (g.cover ? `<img src="${esc(g.cover)}" alt="">` : '');
const ITEMS = GAMES.concat([{ soon: true, title: 'Novo jogo', tag: 'Em breve', desc: 'Aventura e outros estilos virão aqui.' }]);
const row = document.getElementById('row'), hero = document.getElementById('hero'), info = document.getElementById('info');
let sel = 0;
try { const last = localStorage.getItem('launcherUltimo'); const i = GAMES.findIndex(g => g.id === last); if (i >= 0) sel = i; } catch (e) {}

/* fundos: uma camada por jogo, criada uma única vez */
const layers = ITEMS.map(g => {
  const d = document.createElement('div'); d.className = 'layer';
  d.innerHTML = g.soon ? '' : coverHTML(g);
  if (g.soon) d.style.background = 'radial-gradient(circle at 70% 30%,#1a2340,#05070d 70%)';
  hero.appendChild(d); return d;
});
const tiles = ITEMS.map((g, i) => {
  const b = document.createElement('button');
  b.className = 'tile' + (g.soon ? ' soon' : '');
  b.setAttribute('role', 'option'); b.setAttribute('aria-label', g.title);
  b.innerHTML = g.soon ? '+' : coverHTML(g);
  b.onclick = () => { if (sel === i) play(); else select(i); };
  row.appendChild(b); return b;
});

function select(i) {
  sel = Math.max(0, Math.min(ITEMS.length - 1, i));
  tiles.forEach((t, k) => { t.classList.toggle('on', k === sel); t.setAttribute('aria-selected', k === sel); });
  layers.forEach((l, k) => l.classList.toggle('on', k === sel));
  tiles[sel].scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' });
  const g = ITEMS[sel];
  let chips = [];
  try { chips = g.stats ? g.stats() : []; } catch (e) {}
  info.innerHTML = `<span class="eyebrow">${esc(g.tag || 'Jogo')}</span><h1>${esc(g.title)}</h1><p>${esc(g.desc || '')}</p>
    ${chips.length ? `<div class="stats">${chips.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>` : ''}
    <div class="actions">${g.soon ? '<span class="btn" aria-disabled="true">Em breve</span>' : `<a class="btn" href="${esc(g.id)}/" id="go">Jogar ▸</a>`}</div>`;
  const go = document.getElementById('go');
  if (go) go.onclick = e => { e.preventDefault(); play(); };
}

function play() {
  const g = ITEMS[sel]; if (!g || g.soon) return;
  try { localStorage.setItem('launcherUltimo', g.id); } catch (e) {}
  document.getElementById('launchTxt').textContent = 'Iniciando ' + g.title + '…';
  document.getElementById('launch').classList.add('show');
  setTimeout(() => { location.href = g.id + '/'; }, 700);
}
/* ao voltar pelo botão Voltar do navegador, some a tela de carregamento */
addEventListener('pageshow', () => document.getElementById('launch').classList.remove('show'));

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { select(sel + 1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { select(sel - 1); e.preventDefault(); }
  else if (e.key === 'Home') select(0);
  else if (e.key === 'End') select(ITEMS.length - 1);
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); play(); }
});

/* controle (Gamepad API): direcional ou analógico navega, A confirma */
const pad = document.getElementById('pad');
let prev = {}, holdT = 0;
function poll(t) {
  const gp = [...(navigator.getGamepads ? navigator.getGamepads() : [])].find(Boolean);
  pad.hidden = !gp;
  if (gp) {
    const ax = gp.axes[0] || 0;
    const right = (gp.buttons[15] && gp.buttons[15].pressed) || ax > .5;
    const left = (gp.buttons[14] && gp.buttons[14].pressed) || ax < -.5;
    const a = gp.buttons[0] && gp.buttons[0].pressed;
    const dir = right ? 1 : left ? -1 : 0;
    if (dir && (dir !== prev.dir || t - holdT > 180)) { select(sel + dir); holdT = t + (dir !== prev.dir ? 220 : 0); }
    if (a && !prev.a) play();
    prev = { dir, a };
  }
  requestAnimationFrame(poll);
}
requestAnimationFrame(poll);

function tick() { document.getElementById('clock').textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }
tick(); setInterval(tick, 10000);
select(sel);
</script>
</body>
</html>
